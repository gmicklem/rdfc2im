# The BlueGenes home page's call-to-action blocks for this build's mine [im-9n4.60].
#
# tools/trial-stage.sh copies this file into the staged webapp as WEB-INF/rdfc2im.web.properties on every build.
# The mine serves every WEB-INF/<word>.web.properties (and then WEB-INF/web.properties, which wins on a clash) at
# /service/web-properties, and BlueGenes builds its home page from bluegenes.homepage.* there
# (bluegenes events/webproperties.cljs, pages/home/views.cljs). Each block needs label, text (Markdown, one
# paragraph) and exactly one of: route (a BlueGenes page without parameters, opens in the same tab), dispatch (a
# BlueGenes event without arguments) or url (opens in a new tab). A custom list replaces all eight default blocks,
# so they are given again here, in BlueGenes' order, with one change: block 2, BlueGenes' "Browse sources" (its own
# four-column DataSet query, the "All data sources" results page of HumanMine's home page), is replaced by a link
# to this build's public template "All data sources" (curation/metadata_templates.sql), which adds the version,
# licence and citation. Paths are root-relative: BlueGenes is served at / with the mine namespace humanmine
# (trial/docker-compose.yml BLUEGENES_DEFAULT_NAMESPACE). "What's new" loses BlueGenes' three latest InterMine
# blog posts (a property can only give text). ASCII only (Properties.load reads ISO-8859-1).
bluegenes.homepage.cta.1.label=Analyse data
bluegenes.homepage.cta.1.route=upload
bluegenes.homepage.cta.1.text=**Upload** your own sets of genes, proteins, transcripts or other data type to analyse against the integrated data.
bluegenes.homepage.cta.2.label=All data sources
bluegenes.homepage.cta.2.url=/humanmine/templates/All_data_sources
bluegenes.homepage.cta.2.text=Every data set in this mine with its source, the version loaded, its licence, the paper to cite and links to the **original data**. Also under Templates, category Metadata.
bluegenes.homepage.cta.3.label=Build your own query
bluegenes.homepage.cta.3.route=querybuilder
bluegenes.homepage.cta.3.text=The **Query Builder** allows you to select and combine data classes, apply filters and configure the result table. For a full set of pre-built searches, see Templates in the menu.
bluegenes.homepage.cta.4.label=Tutorials
bluegenes.homepage.cta.4.url=http://intermine.org/intermine-user-docs/
bluegenes.homepage.cta.4.text=Learn more about InterMine and how to search and analyse the data with a comprehensive set of **written and video tutorials**.
bluegenes.homepage.cta.5.label=Web services
bluegenes.homepage.cta.5.url=http://intermine.org/im-docs/docs/web-services/index
bluegenes.homepage.cta.5.text=The **InterMine API** has language bindings for Perl, Python, Ruby and Java, allowing you to easily run queries directly from scripts. All queries available in the user interface can also be run through the API with results being returned in a number of formats.
bluegenes.homepage.cta.6.label=Submit feedback
bluegenes.homepage.cta.6.dispatch=home/scroll-to-feedback
bluegenes.homepage.cta.6.text=**Contact us** with problems, comments, suggestions and any other queries.
bluegenes.homepage.cta.7.label=What's new
bluegenes.homepage.cta.7.url=https://intermineorg.wordpress.com/
bluegenes.homepage.cta.7.text=News from the InterMine community.
bluegenes.homepage.cta.8.label=Cite us
bluegenes.homepage.cta.8.url=http://intermine.org/publications/?doi=10.1093/bioinformatics/bts577
bluegenes.homepage.cta.8.text=Please help us to maintain funding: if we have helped your research please remember to cite us in your publications.
