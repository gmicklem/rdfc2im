# Hand-curated overrides applied by rdfc2im/project.py (_apply_priority_overrides) on top of
# genomic_priorities.properties' auto-generated ordering, after every regeneration - same role
# as extra_allow.txt / extensions_additions.xml, but for priority ORDER rather than model
# content. Add an entry here only when merge_priorities()'s "stock alongside source ranks
# first" default has been confirmed live to be wrong for that specific field - see
# _apply_priority_overrides's own docstring for why this can't be fixed generally.

# merge_priorities() ranks stock "reactome" first for every field humanmine-reactome writes,
# on the assumption HumanMine's own value should stand - correct for identifier/name/organism
# (reactome does provide those), wrong for description: ReactomeConverter.java never sets it
# (confirmed reading the converter and reactome_additions.xml - only identifier/name/shortName/
# curated are declared), so ranking it first silently starved every pathway reactome also
# touches of a description that only humanmine-reactome ever provides. Confirmed live before
# this override: 2344 of 2883 pathways (every one reactome's own UniProt2Reactome.txt also
# covers) had no description at all, while the other 539 (ours only) did.
Pathway.description = humanmine-reactome, reactome, *

# hpo-annotation writes Disease objects with a primaryIdentifier and no name (the names come from omim and
# orphanet), but HumanMine ranks it second for Disease.name. Where a disease is in both hpo-annotation and
# orphanet the ranked-first source without a value starved the name: all 72 ORPHANET diseases linked to panel
# genes had no name (confirmed live, 18 Nov 2026), the 11,573 only orphanet knows kept theirs [im-9n4.15].
Disease.name = omim, orphanet, humanmine-clinvar, hpo-annotation, *

# The same starvation for Gene.secondaryIdentifier: ncbigene ranked first, and where its record has no
# Ensembl id (or key_ambiguity dropped a shared one) the gene lost the one hgnc gives. With every human
# gene loaded (--gene-identifiers all) that was 7,337 genes: 38,075 human genes had an Ensembl id, not
# 45,412 (confirmed live, 18 Nov 2026); in the panel build one gene. hgnc first is safe: its values are
# unique (key_ambiguity) and it yields every id ncbigene gives to another gene (defer_to) [im-9n4.40].
Gene.secondaryIdentifier = humanmine-hgnc, humanmine-ncbigene, depmap-expression, humanmine-ensembl, humanmine-gwascatalog, *

# go-annotation makes an accession-only Protein stub for each UniProt "with" id, with no organism, and ranking
# it above humanmine-hgnc let that null win for 968 human proteins that hgnc does give an organism (confirmed
# live, 19 Nov 2026). hgnc goes ahead of go-annotation; the stubs left are GO evidence "with" targets only [im-9n4.49].
Protein.organism = uniprot, humanmine-uniprot, humanmine-hgnc, go-annotation, *

# update-data-sources fills DataSource.url and description from UniProt's dbxref.txt for every DataSource whose name is a
# UniProt database abbreviation, which includes the ones the RDF sources write with their RDF Portal dataset page as url
# ("Conflicting values for field DataSource.url between humanmine-ensembl and update-data-sources"), and it cannot rank
# last: the sources that write the DataSource without a url or description are still recorded as the source of that
# empty field (tracker rows url/description by humanmine-uniprot), so a lower rank never fills it. It ranks ahead of
# the rest: the canonical site of a database named in UniProt's list replaces the RDF Portal dataset page the RDF
# sources write [im-9n4.27]. First comes data-set-links (tools/source_pages.py data-set-links, added by full-build.sh
# to every build), which took humanmine-static's place [im-9n4.52]: it writes the url and description of the
# DataSources no UniProt abbreviation covers (NCBI, Panther, UniProt, ...: the stock mapping files' data_source_url),
# so the two never write the same DataSource.
DataSource.url = data-set-links, update-data-sources, *
DataSource.description = data-set-links, update-data-sources, *
