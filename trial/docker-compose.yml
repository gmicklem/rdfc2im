# Local trial stack for the rdfc2im load: PostgreSQL, the InterMine webapp, and BlueGenes.
#
# Everything is published to 127.0.0.1 only - reach it with `ssh -L` (see ../LOAD-TRIAL.md).
# Run `make trial-stage` first: it explodes the built war into artifacts/humanmine/ and
# collects BlueGenes' jars into artifacts/bluegenes-lib/.  Both are gitignored build output.
#
#   make up | down | status | logs
#
# `down` stops and removes the containers but KEEPS the pgdata volume; use
# `make trial-destroy` to throw the database away.
#
# Names and host ports come from the environment, with this stack's own values as defaults, so a
# second stack can run beside the first (tools/full-build.sh --stack-name sets all of these):
#   RDFC2IM_PREFIX        container and volume name prefix (default rdfc2im: rdfc2im-postgres, ...)
#   COMPOSE_PROJECT_NAME  Compose's own project name (default: this directory's name, `trial`).
#                         A second stack MUST set it too: Compose identifies containers by project
#                         and service, so a second `up` in the same project recreates the first
#                         stack's containers instead of starting new ones.
#   PG_PORT, SOLR_PORT, MINE_PORT, BG_PORT   host ports (defaults 15432, 8983, 8090, 5000)
#   RDFC2IM_ARTIFACTS     directory holding the staged humanmine/ (exploded war) and bluegenes-lib/ that
#                         the mine and BlueGenes containers mount (default ./artifacts, next to this
#                         file). Per stack: tools/full-build.sh --stack-name points it at
#                         $TRIAL_HOME/artifacts, so two stacks never share (and overwrite) a webapp
#                         [im-ore.21]. `make trial-stage` writes to the same place when it is set.
#   RDFC2IM_PGDATA, RDFC2IM_SOLRDATA   absolute host directories to keep the PostgreSQL and Solr
#                         data in (they must exist; the Compose volume binds them). Unset (the
#                         default) the data lives in ordinary named Docker volumes, under
#                         /var/lib/docker, exactly as before. Set them when /var/lib/docker is small
#                         or the data should sit on another disk: the same bind-mounted volumes
#                         drive-ut2.sh used to create by hand with `docker volume create
#                         --opt type=none --opt o=bind --opt device=DIR`. A volume that already
#                         exists keeps the way it was made - Compose does not change it - so set
#                         these before the stack's first `up`, or remove the volume first.
services:

  postgres:
    image: docker.io/library/postgres:14
    container_name: ${RDFC2IM_PREFIX:-rdfc2im}-postgres
    # Default max_connections (100) isn't enough for InterMine's have.file.xml.tgt loader
    # (XmlDataLoaderTask), which opens far more concurrent connections than the have.large
    # loader at real data volumes - confirmed hitting "sorry, too many clients already" loading
    # hgnc (44k Gene items) at the default. 300 cleared it once for a single source, but a full
    # first-time build (9 sources, each `./gradlew :dbmodel:integrate` in sequence reusing the
    # same long-lived Gradle daemon) confirmed live it still exhausts 300 partway through the
    # 9-source loop - the daemon's own JDBC connections apparently aren't released between
    # per-source invocations. 2000 gives generous headroom (container has 15Gi RAM available;
    # max_connections mostly reserves memory, not active usage) rather than chasing the exact
    # daemon-reuse leak or manually restarting postgres between every source.
    command: ["postgres", "-c", "max_connections=2000"]
    environment:
      POSTGRES_USER: intermine
      POSTGRES_PASSWORD: intermine
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # published so the host-side gradle tasks (builddb, integrate) can reach it
      - "127.0.0.1:${PG_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intermine"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  solr:
    image: docker.io/library/solr:8.6.2
    container_name: ${RDFC2IM_PREFIX:-rdfc2im}-solr
    # Backs create-search-index/create-autocomplete-index (dbmodel:postProcess) and the
    # webapp's own /service/search + autocomplete lookups. The two cores it needs
    # (humanmine-search, humanmine-autocomplete - names come from this mine's own
    # keyword_search.properties/objectstoresummary.config.properties, baked into
    # dbmodel.jar and patched by trial-stage.sh to point at this service instead of the
    # sandbox's own localhost:8983) are NOT created by this compose file - Solr's image
    # only supports precreating one core via `command`. Create both once, after the
    # first `make up` (see LOAD-TRIAL.md "Connecting"):
    #   docker exec rdfc2im-solr solr create_core -c humanmine-search
    #   docker exec rdfc2im-solr solr create_core -c humanmine-autocomplete
    # They persist in the solrdata volume across `down`/`up`; only `trial-destroy` loses them.
    # Then run tools/solr-search-schema-fix.sh (once, against humanmine-search only) - the
    # default schemaless configset's auto-guessed field types have no partial-word matching,
    # so a bare quicksearch term never matches anything without it. See that script's own
    # header comment for the full story and the re-index command to run after it.
    volumes:
      - solrdata:/var/solr
    ports:
      - "127.0.0.1:${SOLR_PORT:-8983}:8983"
    restart: unless-stopped

  mine:
    image: docker.io/library/tomcat:8.5-jdk8-temurin
    container_name: ${RDFC2IM_PREFIX:-rdfc2im}-mine
    depends_on:
      postgres:
        condition: service_healthy
      solr:
        condition: service_started
    environment:
      # rdfc2im.mine.port: the HTTP connector port in tomcat/server.xml (see the ports comment below)
      CATALINA_OPTS: "-Xmx3g -Djava.awt.headless=true -Drdfc2im.mine.port=${MINE_PORT:-8090}"
    # Tomcat's own log directory, size-capped. Tomcat's juli FileHandler rotates daily but has
    # no size limit, so a per-request error (one bad webconfig-model.xml makes EVERY classic-UI
    # page log a full Struts/Tiles stack trace, and every failing DWR call logs another) grows
    # these files without bound inside the container's writable layer. Confirmed live and
    # destructive: localhost.<date>.log reached 2.3GB and ddi-ws.log 1.3GB, /var/lib/docker hit
    # 100%, and Postgres died mid-WAL-redo with "could not extend file: No space left on
    # device". A tmpfs makes that structurally impossible - writes fail at the cap instead of
    # eating the host disk, and the database can no longer be collateral damage. 512m is large
    # enough to keep a session's logs readable for debugging (they are still `docker exec cat`-
    # able while the container runs); they are deliberately not durable across a restart, which
    # is the right trade for a trial stack whose whole point is being rebuilt from scratch.
    tmpfs:
      - /usr/local/tomcat/logs:size=512m
    volumes:
      # exploded webapp; its two properties files are patched at stage time to point
      # at the `postgres` service rather than the host's published port
      - ${RDFC2IM_ARTIFACTS:-./artifacts}/humanmine:/usr/local/tomcat/webapps/humanmine:ro
      # listens on MINE_PORT (8090), not 8080: InterMine fetches its own query.xsd from
      # webapp.baseurl (http://localhost:<MINE_PORT>), so the port INSIDE the container must
      # equal the published one or every query-service call fails with "Connection refused"
      - ./tomcat/server.xml:/usr/local/tomcat/conf/server.xml:ro
    ports:
      - "127.0.0.1:${MINE_PORT:-8090}:${MINE_PORT:-8090}"
      # BlueGenes shares this container's network namespace (see its network_mode below), so its
      # published port is declared here
      - "127.0.0.1:${BG_PORT:-5000}:5000"
    restart: unless-stopped

  bluegenes:
    image: docker.io/library/eclipse-temurin:17-jre
    container_name: ${RDFC2IM_PREFIX:-rdfc2im}-bluegenes
    depends_on:
      - mine
    # Share the mine's network namespace: `localhost` inside this container IS the mine, so the
    # one service root http://localhost:<MINE_PORT>/humanmine works for the server and the browser.
    # Consequences: BlueGenes' port is published by the mine service (above), and restarting the
    # mine container alone leaves this one on the dead namespace - `docker compose up -d` or
    # restart both (tools/full-build.sh does).
    network_mode: "service:mine"
    environment:
      SERVER_PORT: "5000"
      # What the BROWSER calls, and - because there is no separate BLUEGENES_BACKEND_SERVICE_ROOT -
      # what the BlueGenes server calls too. BlueGenes builds browser-facing URLs from the
      # backend root when one is set (the /favicon.ico redirect, the schema.org JSON-LD in the
      # page), so a compose-internal `http://mine:<port>` there reached the browser and was
      # unresolvable on the user's machine [im-ore.8]. The server reaches the mine as
      # localhost:<port> because it shares the mine's network namespace (network_mode below).
      BLUEGENES_DEFAULT_SERVICE_ROOT: "http://localhost:${MINE_PORT:-8090}/humanmine"
      BLUEGENES_DEFAULT_MINE_NAME: "rdfc2im trial (GO only)"
      BLUEGENES_DEFAULT_NAMESPACE: "humanmine"
      HIDE_REGISTRY_MINES: "true"
      LOGGING_LEVEL: "info"
    volumes:
      - ${RDFC2IM_ARTIFACTS:-./artifacts}/bluegenes-lib:/opt/bluegenes/lib:ro
    working_dir: /opt/bluegenes
    # BlueGenes hardcodes its Jetty bind to 0.0.0.0 (no :host in run-jetty), which is fine
    # here: the container's netns confines it, and podman publishes only to loopback.
    command: ["java", "-cp", "/opt/bluegenes/lib/*", "bluegenes.core"]
    restart: unless-stopped

# driver_opts: with the RDFC2IM_*DATA variables unset all three are empty strings, which Docker's
# local driver treats as a plain named volume (checked on Compose 5.6 / Docker 29: same mountpoint
# under /var/lib/docker, an existing volume is reused untouched); set, type=none o=bind device=DIR
# makes it a bind mount of that directory.
volumes:
  pgdata:
    name: ${RDFC2IM_PREFIX:-rdfc2im}-pgdata
    driver: local
    driver_opts:
      type: ${RDFC2IM_PGDATA:+none}
      o: ${RDFC2IM_PGDATA:+bind}
      device: ${RDFC2IM_PGDATA:-}
  solrdata:
    name: ${RDFC2IM_PREFIX:-rdfc2im}-solrdata
    driver: local
    driver_opts:
      type: ${RDFC2IM_SOLRDATA:+none}
      o: ${RDFC2IM_SOLRDATA:+bind}
      device: ${RDFC2IM_SOLRDATA:-}
