# Front for the ut demo BlueGenes on :15001 (project rdfc2im-ut-front).
# Runs with network_mode: host, so 127.0.0.1 is the sandbox host:
#   BlueGenes jar   127.0.0.1:15011  (upstream)
#   aligner         127.0.0.1:13000  (the aligner container's published port)
#   JBrowse 2       127.0.0.1:14881  (the jbrowse2 container's published port)
# Same three jobs as docker_template/nginx/nginx.conf.template:
#   POST /align-sequence      -> the sequence-alignment service
#   /vendor/imjs/im.min.js    -> a pinned copy of imjs (mounted from the host)
#   every BlueGenes HTML page gets <script src="/vendor/imjs/im.min.js"> before </head>
# BlueGenes maint-2026 has no setting for the script tag (it bundles imjs inside app.js
# instead, but the tool-store tests and the tools look for a script tag), so sub_filter it is.
server {
	listen 0.0.0.0:15001;
	server_name _;
	client_max_body_size 10m;
	gzip on;
	gzip_types text/css text/javascript application/javascript application/json text/plain image/svg+xml;

	location = /align-sequence {
		proxy_pass http://127.0.0.1:13000;
		proxy_set_header Host $host;
	}
	# JBrowse 2 on the BlueGenes origin, as HumanMine serves it at /jbrowse2/ (docker_template
	# nginx.conf.template). The container sends no X-Frame-Options, so the tool's iframe works.
	location = /jbrowse2 {
		return 301 /jbrowse2/;
	}
	location /jbrowse2/ {
		proxy_pass http://127.0.0.1:14881/;
		proxy_set_header Host $http_host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
	location /vendor/ {
		alias /usr/share/nginx/vendor/;
		expires 30d;
	}
	location / {
		proxy_pass http://127.0.0.1:15011;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		# sub_filter needs an uncompressed upstream body; clients still get gzip from here.
		proxy_set_header Accept-Encoding "";
		sub_filter '</head>' '<script src="/vendor/imjs/im.min.js"></script></head>';
		sub_filter_once on;
	}
}
