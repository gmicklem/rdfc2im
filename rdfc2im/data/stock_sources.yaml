      - "\"You do not need a special license for commercial use but please cite the resource and relevant individual member databases and keep the Copyright statement with your installation.\" (a request; CC0 imposes none)."
      - "protein2ipr.dat.gz (ftp.ebi.ac.uk/pub/databases/interpro/current_release/) has no licence line of its own; the statement is the InterPro documentation page, as for interpro-go."
      - "The same page: \"The included scanning tools and signature collections may be under different license terms\" (InterProScan software, not these downloads)."
    redistributable: true
    redistributable_reason: "CC0 allows redistribution without conditions."
    data_dir: interpro/match_complete/current
    properties:
      protein2ipr.organisms: "9606"
    after: [uniprot]
    notes: >-
      Protein2iprConverter loads a ProteinDomainRegion for each row whose protein (column 1) is already in
      os.production with a human organism, so it must integrate after the UniProt sources (the table's `after`);
      the 13,754,882,460-byte protein2ipr.dat.gz (4 Nov 2026) is read as it downloads and cut to the panel's
      UniProt accessions (`stream: true`, about 70 minutes at the sandbox's 3 MB/s, nothing stored), which keeps a
      few thousand rows. Columns: protein accession, InterPro entry, entry name, member-database signature,
      start, end. The converter's getSource() names NCBIfam (`NF`) and AntiFam (`ANF`) as well as the older member
      databases and skips a prefix it does not know, so the cut keeps every row of the panel's proteins (1,070 of the
      323,843 rows in the first 5 MB of the file are NCBIfam).
      The group cached on 20 Nov 2026 was streamed while the converter still threw on `NF`, with a `require` filter
      that dropped those rows; the stream took 60 minutes, so `accept_cuts` below lets a build restore that group
      under its old key. It holds no NCBIfam rows: they appear only after the next fetch of protein2ipr (remove the
      `accept_cuts` entry and the group stock-protein2ipr from the filtered cache, then build).
      Full scope: the converter reads the whole file (13.8 GB gzipped, about 100 GB decompressed) and keeps the
      rows of the proteins in the mine.
    files:
      - id: matches
        url: https://ftp.ebi.ac.uk/pub/databases/interpro/current_release/protein2ipr.dat.gz
        verified: true
        size: 13754882460
        last_modified: "2026-11-04"
        stream: true
        stage_as: protein2ipr.dat
        filter:
          format: tab
          ids: uniprot
          column: "1"
        accept_cuts:
          - reason: >-
              Streamed on 20 Nov 2026 (60 minutes) with the NCBIfam filter the old converter needed; temporary: delete
              this entry and the group stock-protein2ipr to fetch the NCBIfam and AntiFam matches
            filter:
              format: tab
              ids: uniprot
              column: "1"
              require: ["4=^(PF|SM|SSF|SFLD|PS|PR|PTHR|G3DSA|TIGR|PD|PIRSF|MF_|cd)"]

