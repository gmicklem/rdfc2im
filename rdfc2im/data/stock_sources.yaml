# Stock InterMine and HumanMine sources a hybrid build loads beside the rdfc2im ones
# (tools/full-build.sh --stock-sources "a b c"; plan 50 in the planning repo, decisions D-1 to D-10).
# Read through rdfc2im/stock.py (`python -m rdfc2im stock ...`), never parsed by bash.
#
# One entry per HumanMine project.xml <source name>:
#   type             the project.xml source type; the loader jar is org.intermine:bio-source-<type>
#   jar              intermine: built from the --intermine-src checkout (6.0 line, D-5) and published
#                      into its private m2 repo by phase publish_intermine;
#                    humanmine-bio-sources: built in the maint-2026 branch of the humanmine-bio-sources
#                      fork (version 4.3.0), like humanmine-items
#   licence          the licence name as the source states it (SPDX identifier where one fits), or "not verified"
#   licence_status   verified (stated on the source's own page or file) | partial (a related statement was read, the
#                    full one was not) | not-verified (the source points to a page that could not be read) |
#                    not-stated (nothing findable) | not-checked
#   licence_url      the page or file where the licence is stated (or, for not-stated, what was looked at)
#   licence_checked  the date (UTC) the statement was read
#   licence_quote    one or two sentences copied from that page (absent when nothing is stated)
#   licence_conditions  list: attribution wording, share-alike, no-commercial, registration, caveats and what was
#                    looked at when nothing is stated
#   redistributable  false: the data must never enter cached_raw_data/ or the CI release asset
#                    (D-7; `cache save --for-release` refuses it, T0.3). true means the stated terms allow a filtered
#                    copy in a public release asset; with licence_status other than verified it means only that no
#                    stated term forbids it (the flag stays true so the build does not break; see docs/LICENCES.md)
#   redistributable_reason  why, in a sentence
#   The record of every source (stock, RDF, tools) with the mine's DataSet values is docs/LICENCES.md.
#   local_copy       required: the files come only from --stock-local DIR/<name>/<raw_name>
#                    (default optional: a local copy, when present, is used instead of the download)
#   data_dir         HumanMine's own data directory under /micklem/data (in/humanmine_project.xml);
#                    the filtered files are staged there under RDFC2IM_DATA_ROOT
#   data_property    src.data.dir (default) or src.data.file (then data_file is the file name)
#   properties       project.xml property values to set (organisms cut to human, ...);
#                    "{data_root}" stands for /micklem/data. The three loaders that stamp DataSet.licence from a
#                    property (uniprot-fasta and ncbi-fasta `fasta.licence`, ncbi-gff `gff3.licence`) get the URL docs/LICENCES.md records for the source, licence_status verified
#                    only. go-annotation has a `licence` setter too, but its converter makes the DataSet in the constructor, before
#                    the property is set, so the stamp never reaches it; the other stock loaders read no such property
#                    (see docs/LICENCES.md) [im-9n4.45]
#   after            integrate-order constraints (plan 50 row 11): HumanMine source names this one
#                    must load after; a name replaced by an rdfc2im source stands for its replacement
#   needs            other stock sources that must be selected with this one
#   postprocess      postprocesses the source needs (plan 50 row 12; run by phase_postprocess)
#   load_first       true: load before every rdfc2im source (rdfc2im project moves it there), for a
#                    stock source whose keys cannot match the objects rdfc2im sources create
#   files            the upstream files:
#     id             short name, unique in the entry
#     url            the download (null for local-only data)
#     raw_name       file name of the download (default: the url's basename)
#     verified       true: a HEAD (or one-byte GET) request answered 200 from the sandbox on the date
#                    in `checked`; size and last_modified are from that answer
#     unpack, member zip | tar.gz, and the member (name or glob) to take from the archive
#     stage_as       the file name the converter expects (the loaders read plain text only: no .gz)
#     filter         none (the file is used whole), or {format, ids, column, taxon, keep_header}:
#                    tools/subset_raw.py filter --format F --ids <idsets>/<ids>.txt [--column N]
#                    [--taxon T] [--keep-comments]; format psi-xml also takes xref_db (the xref db
#                    names whose ids are matched) and reads a zip's member glob itself, one filtered
#                    file per member, staged under the members' names [im-9n4.13]
#   notes            anything a later task must know (format drift since HumanMine's 2022 load, ...)
#
# Loaders gated by the ID resolver (omim, the HumanMine expression sources) are filter: none here:
# T0.3's filtered ${resolver.file.rootpath}/entrez does their gene cut. With the all-human resolver
# (D-1) that cuts nothing for a human-gene file, so the interaction and orthologue files (psi-intact,
# biogrid, panther) are pre-filtered to records with at least one panel gene; the resolver then
# decides whether the partner loads.
#
# Every URL was checked on 17 Nov 2026 unless the file says verified: false.

sources:
  uniprot:
    type: uniprot
    jar: intermine
    licence: "CC-BY-4.0"
    licence_status: verified
    licence_url: "https://ftp.ebi.ac.uk/pub/databases/uniprot/current_release/knowledgebase/complete/README"
    licence_checked: "2026-11-18"
    licence_quote: "We have chosen to apply the Creative Commons Attribution 4.0 International (CC BY 4.0) License (https://creativecommons.org/licenses/by/4.0/) to all copyrightable parts of our databases."
    licence_conditions:
      - "Attribution: credit the UniProt Consortium and say that the data were changed (this build keeps human Swiss-Prot entries, cut to the gene panel)."
      - "The README adds: some data may be covered by patents or other rights, and medical or genetic information is for research, educational and informational purposes only."
      - "The XML file ends with <copyright>: \"Copyrighted by the UniProt Consortium, see https://www.uniprot.org/terms Distributed under the Creative Commons Attribution (CC BY 4.0) License\"."
    redistributable: true
    redistributable_reason: "CC BY 4.0 allows redistribution of changed copies with attribution."
    data_dir: uniprot/current
    properties:
      uniprot.organisms: "9606"
    postprocess: []
    load_first: true
    notes: >-
      load_first: its keys give Protein only md5checksum+organism, so loaded after humanmine-hgnc
      it made a second Protein per accession and isoforms ended with dangling canonicalProtein
      references (im-9n4.6).
      Swiss-Prot only (D-6): no TrEMBL file. With uniprot.organisms set, UniprotConverter takes
      only files named <taxon>_uniprot_sprot.xml (anything else is logged as a bad file and
      skipped), so the shared uniprot/current directory can also hold keywlist.xml and the
      varsplic FASTA. The human Swiss-Prot XML is 175 MB gzipped, not the 80 MB plan 50 estimated.
    files:
      - id: sprot
        url: https://ftp.ebi.ac.uk/pub/databases/uniprot/current_release/knowledgebase/taxonomic_divisions/uniprot_sprot_human.xml.gz
        verified: true
        size: 174683391
        last_modified: "2026-11-04"
        stage_as: 9606_uniprot_sprot.xml
        filter: {format: uniprot-xml, ids: uniprot}

  uniprot-keywords:
    type: uniprot-keywords
    jar: intermine
    licence: "CC-BY-4.0"
    licence_status: verified
    licence_url: "https://ftp.ebi.ac.uk/pub/databases/uniprot/current_release/knowledgebase/complete/README"
    licence_checked: "2026-11-18"
    licence_quote: "We have chosen to apply the Creative Commons Attribution 4.0 International (CC BY 4.0) License (https://creativecommons.org/licenses/by/4.0/) to all copyrightable parts of our databases."
    licence_conditions:
      - "Attribution: credit the UniProt Consortium and say that the data were changed (this build keeps human Swiss-Prot entries, cut to the gene panel)."
      - "The README adds: some data may be covered by patents or other rights, and medical or genetic information is for research, educational and informational purposes only."
      - "keywlist.xml has no <copyright> element of its own; the statement is the README of the same release tree."
    redistributable: true
    redistributable_reason: "CC BY 4.0 allows redistribution with attribution (the file is used whole)."
    data_dir: uniprot/current
    notes: >-
      The EBI mirror has only keywlist.xml.gz (keywlist.xml is a 404 there); project.xml's
      src.data.dir.includes=keywlist.xml picks the unpacked file out of the shared directory.
    files:
      - id: keywlist
        url: https://ftp.ebi.ac.uk/pub/databases/uniprot/current_release/knowledgebase/complete/docs/keywlist.xml.gz
        verified: true
        size: 155546
        last_modified: "2026-11-04"
        stage_as: keywlist.xml
        filter: none

  uniprot-fasta:
    type: fasta
    jar: intermine
    licence: "CC-BY-4.0"
    licence_status: verified
    licence_url: "https://ftp.ebi.ac.uk/pub/databases/uniprot/current_release/knowledgebase/complete/README"
    licence_checked: "2026-11-18"
    licence_quote: "We have chosen to apply the Creative Commons Attribution 4.0 International (CC BY 4.0) License (https://creativecommons.org/licenses/by/4.0/) to all copyrightable parts of our databases."
    licence_conditions:
      - "Attribution: credit the UniProt Consortium and say that the data were changed (this build keeps human Swiss-Prot entries, cut to the gene panel)."
      - "The README adds: some data may be covered by patents or other rights, and medical or genetic information is for research, educational and informational purposes only."
      - "The FASTA file has no licence line of its own; the statement is the README of the same release tree."
    redistributable: true
    redistributable_reason: "CC BY 4.0 allows redistribution of changed copies with attribution."
    data_dir: uniprot/current
    properties:
      fasta.licence: "https://creativecommons.org/licenses/by/4.0/"
      fasta.taxonId: "9606"
    after: [uniprot]
    notes: >-
      UniProtFastaLoaderTask takes fasta.includes=uniprot_sprot_varsplic.fasta and the
      organism from each header's OS= name. Isoforms only; the canonical sequences come from
      the Swiss-Prot XML.
    files:
      - id: varsplic
        url: https://ftp.ebi.ac.uk/pub/databases/uniprot/current_release/knowledgebase/complete/uniprot_sprot_varsplic.fasta.gz
        verified: true
        size: 8586697
        last_modified: "2026-11-04"
        stage_as: uniprot_sprot_varsplic.fasta
        filter: {format: fasta, ids: uniprot}

  go-annotation:
    type: go-annotation
    jar: intermine
    licence: "CC-BY-4.0 (GO Consortium); EMBL-EBI GOA copyright notice for the GOA files"
    licence_status: verified
    licence_url: "https://geneontology.org/docs/go-citation-policy/"
    licence_checked: "2026-11-18"
    licence_quote: "Gene Ontology Consortium data and data products are licensed under the Creative Commons Attribution 4.0 Unported License."
    licence_conditions:
      - "CC BY 4.0 attribution as the GO page spells it out: identify the creator (Gene Ontology Consortium), give a copyright notice, a notice that refers to the licence and to the disclaimer of warranties, and a link. Its example: \"Gene Ontology data from the 2024-01-17 release ( DOI:10.5281/zenodo.10536401 ) is made available under the terms of the CC BY 4.0 license.\""
      - "\"We ask that when using or citing GO data that the particular release is mentioned\" (date, optionally the Zenodo DOI). In publications cite Ashburner et al., Nat Genet 2000;25:25-9 and The Gene Ontology Consortium, The Gene Ontology knowledgebase in 2026, Nucleic Acids Res 2025 (doi 10.1093/nar/gkaf1292)."
      - "The EMBL-EBI GOA README (https://ftp.ebi.ac.uk/pub/databases/GO/goa/HUMAN/README) adds: \"This README and the accompanying databases may be copied and redistributed freely, without advance permission, provided that this copyright statement is reproduced with each copy.\" Reproduce \"GOA - GO Annotation. Copyright 2018 (C) The European Bioinformatics Institute.\" The GAF itself (current.geneontology.org/annotations/goa_human.gaf.gz) carries no licence line; the GO page covers it as a GO data product."
    redistributable: true
    redistributable_reason: "CC BY 4.0 allows redistribution with attribution; keep the GOA copyright statement with the copy too."
    data_dir: go-annotation/current/human
    after: [uniprot, go]
    postprocess: [do-sources]
    notes: >-
      GoPostprocess is the source's own postprocess (do-sources). The plugin ignores project.xml's
      src.data.includes, so every file in the directory is read as GAF: stage nothing else there.
      Column 2 is a UniProt accession for human. The GO terms come from rdfc2im's go source,
      which replaces stock go. The With/From column makes "with" Proteins (both UniProt: and UniProtKB:
      prefixes, by primaryAccession, stubs when the protein is not otherwise loaded) since intermine
      079ef219c2 (maint-2026): about 1,413 stub Proteins in the 114-gene panel build, 23,288 for the
      whole human file. The running demo mine has the old code until its next rebuild.
    files:
      - id: gaf
        url: https://current.geneontology.org/annotations/goa_human.gaf.gz
        verified: true
        size: 15041996
        last_modified: "2026-05-28"
        stage_as: gene_association.goa_human
        filter: {format: gaf, ids: uniprot}

  ncbi-gff:
    type: ncbi-gff
    jar: intermine
    licence: "No restrictions by NCBI (NCBI data-use policy; no licence named)"
    licence_status: verified
    licence_url: "https://www.ncbi.nlm.nih.gov/home/about/policies/"
    licence_checked: "2026-11-18"
    licence_quote: "NCBI itself places no restrictions on the use or distribution of the data contained therein."
    licence_conditions:
      - "No licence is named and NCBI asks for no attribution for the data. The policy (Molecular Data Usage) adds: \"some submitters of the original data (or the country of origin of such data) may claim patent, copyright, or other intellectual property rights in all or a portion of the data\"; NCBI \"cannot provide comment or unrestricted permission concerning the use, copying, or distribution of the information contained in the molecular databases\"."
      - "For NCBI's own web pages (public domain): \"it is requested that in any subsequent use of this work, NLM be given appropriate acknowledgment\". Giving that acknowledgement is cheap and the notice files do it."
      - "The server notice (https://ftp.ncbi.nlm.nih.gov/README.ftp) agrees: \"ALL DATA HERE IS PUBLIC, NON-SENSITIVE, UNRESTRICTED SCIENTIFIC DATA SHARING AMONG SCIENTIFIC COMMUNITIES.\""
    redistributable: true
    redistributable_reason: "NCBI places no restrictions on use or distribution of its molecular data; third-party claims on single records are the submitters' (NCBI cannot grant them)."
    data_dir: human/gff/current
    properties:
      gff3.licence: "https://www.ncbi.nlm.nih.gov/home/about/policies/"
    after: [ncbi-gene]
    # No create-gene-flanking-features (Gos Micklem, 20 Nov 2026: gene flanking regions are dropped from the
    # HumanMine build; HumanMine's own project.xml runs it). It made 20 GeneFlankingRegions per located gene and a
    # DataSet "modMine gene flanking regions" with no DataSource that none of them linked to.
    postprocess: [create-chromosome-locations-and-lengths, create-location-overlap-index, create-overlap-view]
    priority_first: [Gene.chromosome]
    chromosome_lengths: {from: gff, source: ncbi-gff-lengths, data_dir: human/gff/lengths}
    notes: >-
      GFF3 converter default includes *.gff,*.gff3; seqids NC_000001.11 to NC_000024.10 are mapped
      to the chromosome names 1-22, X, Y (NcbiGffGFF3SeqHandler); MT (NC_012920.1) is not mapped,
      so its genes would get no location, and rows on alt and unplaced scaffolds (NT_, NW_) are
      dropped by the record handler. The filter keeps every ##sequence-region line, the panel genes
      (Dbxref GeneID) with their Parent closure (transcripts, exons, CDS). `keep_types: [gene]` in
      the filter would also keep every other gene row (the neighbours a genome browser shows, D-1):
      measured 18 Nov 2026, when create-gene-flanking-features still ran, it added 41,955 Genes and (20
      regions per gene) 0.84 million GeneFlankingRegions: 2.18 million objects instead of
      0.37 million, Postgres 4.3 GB instead of 2.0, integrate +45 s, postprocess +270 s (the
      search index most), and 2 duplicate symbols (RefSeq names some tRNA genes alike); left off
      until the thin genome comes from the RDF side (BUILD.md, "Locations and gene models"). Keys: Gene on
      primaryIdentifier (the Entrez id, from Dbxref GeneID), Chromosome on primaryIdentifier and
      organism, both what the rdfc2im sources write, so it merges loaded after them in project.xml
      order (no load_first). No loader sets Chromosome.length from a GFF, so
      `chromosome_lengths` adds the source ncbi-gff-lengths (type humanmine-items, after this one)
      loading the lengths that `subset_raw.py chromosome-lengths` reads from the filtered file's
      ##sequence-region lines [im-9n4.9]. RefSeq annotation release of Aug 2024.
    files:
      - id: gff
        url: https://ftp.ncbi.nlm.nih.gov/refseq/H_sapiens/annotation/GRCh38_latest/refseq_identifiers/GRCh38_latest_genomic.gff.gz
        verified: true
        size: 77807126
        last_modified: "2024-08-27"
        stage_as: GRCh38_latest_genomic.gff
        filter: {format: gff3, ids: entrez}

  ncbi-fasta:
    type: fasta
    jar: intermine
    licence: "No restrictions by NCBI (NCBI data-use policy; no licence named)"
    licence_status: verified
    licence_url: "https://www.ncbi.nlm.nih.gov/home/about/policies/"
    licence_checked: "2026-11-18"
    licence_quote: "NCBI itself places no restrictions on the use or distribution of the data contained therein."
    licence_conditions:
      - "No licence is named and NCBI asks for no attribution for the data. The policy (Molecular Data Usage) adds: \"some submitters of the original data (or the country of origin of such data) may claim patent, copyright, or other intellectual property rights in all or a portion of the data\"; NCBI \"cannot provide comment or unrestricted permission concerning the use, copying, or distribution of the information contained in the molecular databases\"."
      - "For NCBI's own web pages (public domain): \"it is requested that in any subsequent use of this work, NLM be given appropriate acknowledgment\". Giving that acknowledgement is cheap and the notice files do it."
      - "The server notice (https://ftp.ncbi.nlm.nih.gov/README.ftp) agrees: \"ALL DATA HERE IS PUBLIC, NON-SENSITIVE, UNRESTRICTED SCIENTIFIC DATA SHARING AMONG SCIENTIFIC COMMUNITIES.\""
    redistributable: true
    redistributable_reason: "NCBI places no restrictions on use or distribution of its molecular data; third-party claims on single records are the submitters' (NCBI cannot grant them)."
    data_dir: human/fasta/current
    properties:
      fasta.licence: "https://www.ncbi.nlm.nih.gov/home/about/policies/"
      fasta.taxonId: "9606"
    after: [ncbi-gene]
    needs: [ncbi-gff]
    postprocess: [create-chromosome-locations-and-lengths, transfer-sequences]
    notes: >-
      Optional: tools/full-build.sh --with-genome-sequence adds it (it needs ncbi-gff, whose
      locations transfer-sequences cuts the gene, transcript and exon sequences by). 973 MB
      gzipped. NCBIFastaLoaderTask names a record by the words after "chromosome" in its header
      ("mitochondrion" -> MT), so the alt, patch and unlocalized scaffolds of
      GRCh38_latest_genomic.fna ("chromosome 1 unlocalized genomic scaffold, ...") would become
      hundreds of extra Chromosome objects ("1 unlocalized genomic scaffold"); the filter keeps
      only the 24 records the ncbi-gff loader maps (ids: chromosomes, the NC_ accessions), about
      3.1 GB uncompressed, which also sets Chromosome.length (equal to the GFF's
      ##sequence-region values) [im-9n4.9; never run in the sandbox].
    files:
      - id: genome
        url: https://ftp.ncbi.nlm.nih.gov/refseq/H_sapiens/annotation/GRCh38_latest/refseq_identifiers/GRCh38_latest_genomic.fna.gz
        verified: true
        size: 972898531
        last_modified: "2024-08-27"
        stage_as: GRCh38_latest_genomic.fna
        filter: {format: fasta, ids: chromosomes}

  panther:
    type: panther
    jar: intermine
    licence: "not verified"
    licence_status: not-stated
    licence_url: "https://data.pantherdb.org/ftp/ortholog/current_release/README"
    licence_checked: "2026-11-18"
    licence_conditions:
      - "Looked at (first and second pass): the README beside the download (it describes the files only), the /ftp/ top level and the listings of ortholog/, downloads/, generic_mapping/ (and its README), sequence_classifications/, hmm_classifications/, hmm_scoring/, panther_library/, pathway/, peregrine_data/, panther_interpro/, linkouts/, pub/, tools/ on data.pantherdb.org, and the file's own header: none states a licence or terms. There is no LICENSE or README at /ftp/ (404)."
      - "PANTHER's terms page (https://www.pantherdb.org/tou.jsp) is on an allowed host that refuses automated readers: a Cloudflare \"Just a moment...\" page to curl, a page-load timeout to a headless browser; pantherdb.org without www fails the certificate check through the proxy. It was not worked around. No sbx rule helps; a person has to read the page in an ordinary browser."
      - "The converter stamps the GPL URL on its data set, which nothing found supports. The earlier record (\"free with citation\") was from general knowledge and is not confirmed."
    redistributable: true
    redistributable_reason: "No stated term forbids it and none permits it: unverified. Flag kept so the build does not break; hold stock-panther out of any published asset until the terms are read in a browser."
    data_dir: panther/current
    resolver_taxa: [10116, 7955]
    properties:
      panther.organisms: "9606"
    notes: >-
      Every file in the directory is parsed as tab-separated orthologues. A row is
      `HUMAN|HGNC=8620|UniProtKB=P26367  MOUSE|MGI=MGI=97490|UniProtKB=P63015  LDO  Euarchontoglires  PTHR45636`;
      the cut keeps a row when either gene cell holds a panel UniProt accession (subset_raw's tab filter reads
      the `UniProtKB=` token, [im-9n4.11]). The converter resolves only human, rat and zebrafish genes through
      the ID resolver (human by HGNC id to the Entrez id, as the primary identifier); mouse, fly, worm and yeast
      ids pass through as they are, and rat and fish ones too when the resolver has no file for them, so
      `resolver_taxa` has the build fetch NCBI's rat and zebrafish gene_info for the resolver. PANTHER 19 (Apr 2024).
    files:
      - id: orthologs
        url: https://data.pantherdb.org/ftp/ortholog/current_release/RefGenomeOrthologs.tar.gz
        verified: true
        size: 5932588
        last_modified: "2024-04-02"
        unpack: tar.gz
        member: RefGenomeOrthologs
        stage_as: RefGenomeOrthologs
        filter: {format: tab, ids: uniprot, column: "1,2"}

  mgi-identifiers:
    type: mgi-identifiers
    jar: intermine
    licence: "CC-BY-4.0"
    licence_status: verified
    licence_url: "https://www.informatics.jax.org/mgihome/other/copyright.shtml"
    licence_checked: "2026-11-18"
    licence_quote: "MGI data and annotations are licensed under a Creative Commons Attribution 4.0 International License (CC-BY)."
    licence_conditions:
      - "Attribution to MGI (Mouse Genome Informatics)."
      - "Images on the site are excluded (copyright of the authors); this build uses MRK_List2.rpt only, no images."
    redistributable: true
    redistributable_reason: "CC BY 4.0 allows redistribution of changed copies with attribution."
    data_dir: mgi-identifiers/current
    needs: [panther]      # its cut is the genes on panther's rows
    notes: >-
      Gives the mouse genes their symbol and name (panther creates them with an MGI id alone). The loader reads
      every row of MRK_List2.rpt (78 MB, about 70,000 markers) and makes a Gene of each marker of type Gene; the
      cut keeps the rows of the genes on PANTHER rows with a panel gene (`subset_raw.py partner-ids` writes
      idsets/mgi.txt from the filtered PANTHER file, so panther is cut first). Column 1 is `MGI:97490`.
    files:
      - id: markers
        url: https://www.informatics.jax.org/downloads/reports/MRK_List2.rpt
        verified: true
        size: 78776476
        last_modified: "2026-11-16"
        stage_as: MRK_List2.rpt
        filter: {format: tab, ids: mgi, column: "1"}

  rgd-identifiers:
    type: rgd-identifiers
    jar: intermine
    licence: "CC-BY-4.0"
    licence_status: verified
    licence_url: "https://rgd.mcw.edu/wg/disclaimer/"
    licence_checked: "2026-11-18"
    licence_quote: "Data in RGD are provided under the terms of the Creative Commons Attribution 4.0 International (CC BY 4.0) license."
    licence_conditions:
      - "CC BY 4.0: \"You must give appropriate credit, provide a link to the license, and indicate if changes were made.\" The footer of every RGD page links the licence (\"License CC BY 4.0\", https://creativecommons.org/licenses/by/4.0/)."
      - "Citation RGD asks for (https://rgd.mcw.edu/wg/citing-rgd/): \"RGD [species and datatype] Download file, Rat Genome Database Web Site, Medical College of Wisconsin, Milwaukee, Wisconsin. World Wide Web (URL: http://rgd.mcw.edu/). [Type in date (month, yr) when you retrieved data cited].\" For RGD itself: Rat Genome Database (RGD) (RRID:SCR_006444), and the general citation Vedi M et al., Genetics 2023, PMID 36930729."
      - "The data file (GENES_RAT.txt) and the download host's README carry no licence text; the statement is on RGD's web pages."
    redistributable: true
    redistributable_reason: "CC BY 4.0 allows redistribution of changed copies with attribution."
    data_dir: rgd-identifiers/current
    needs: [panther]      # its cut is the genes on panther's rows
    notes: >-
      Gives the rat genes their symbol, name and description (panther creates them with an RGD id alone). The
      loader reads every row of GENES_RAT.txt (50.7 MB, about 45,000 active rat genes; 38 columns used: 1 the
      RGD id, 2 symbol, 3 name, 4 description, 21 NCBI gene id, 38 Ensembl ids) and makes a Gene `RGD:<n>` of
