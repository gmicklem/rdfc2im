# Stock InterMine and HumanMine sources a hybrid build loads beside the rdfc2im ones
# (tools/full-build.sh --stock-sources "a b c"; plan 50 in the planning repo, decisions D-1 to D-10).
# Read through rdfc2im/stock.py (`python -m rdfc2im stock ...`), never parsed by bash.
#
# One entry per HumanMine project.xml <source name>:
#   type             the project.xml source type; the loader jar is org.intermine:bio-source-<type>
#   jar              intermine: built from the --intermine-src checkout (6.0 line, D-5) and published
#                      into its private m2 repo by phase publish_intermine;
#                    humanmine-bio-sources: built in the maint-2026 branch of the humanmine-bio-sources
#                      fork (version 4.3.0), like humanmine-items
#   licence          the data licence, as far as it is known
#   redistributable  false: the data must never enter cached_raw_data/ or the CI release asset
#                    (D-7; `cache save --for-release` refuses it, T0.3)
#   local_copy       required: the files come only from --stock-local DIR/<name>/<raw_name>
#                    (default optional: a local copy, when present, is used instead of the download)
#   data_dir         HumanMine's own data directory under /micklem/data (in/humanmine_project.xml);
#                    the filtered files are staged there under RDFC2IM_DATA_ROOT
#   data_property    src.data.dir (default) or src.data.file (then data_file is the file name)
#   properties       project.xml property values to set (organisms cut to human, ...);
#                    "{data_root}" stands for /micklem/data
#   after            integrate-order constraints (plan 50 row 11): HumanMine source names this one
#                    must load after; a name replaced by an rdfc2im source stands for its replacement
#   needs            other stock sources that must be selected with this one
#   postprocess      postprocesses the source needs (plan 50 row 12; run by phase_postprocess)
#   load_first       true: load before every rdfc2im source (rdfc2im project moves it there), for a
#                    stock source whose keys cannot match the objects rdfc2im sources create
#   files            the upstream files:
#     id             short name, unique in the entry
#     url            the download (null for local-only data)
#     raw_name       file name of the download (default: the url's basename)
#     verified       true: a HEAD (or one-byte GET) request answered 200 from the sandbox on the date
#                    in `checked`; size and last_modified are from that answer
#     unpack, member zip | tar.gz, and the member (name or glob) to take from the archive
#     stage_as       the file name the converter expects (the loaders read plain text only: no .gz)
#     filter         none (the file is used whole), or {format, ids, column, taxon, keep_header}:
#                    tools/subset_raw.py filter --format F --ids <idsets>/<ids>.txt [--column N]
#                    [--taxon T] [--keep-comments]
#   notes            anything a later task must know (format drift since HumanMine's 2022 load, ...)
#
# Loaders gated by the ID resolver (psi, biogrid, panther, omim, the HumanMine expression sources)
# are filter: none here: T0.3's filtered ${resolver.file.rootpath}/entrez does their gene cut.
#
# Every URL was checked on 17 Nov 2026 unless the file says verified: false.

sources:
  uniprot:
    type: uniprot
    jar: intermine
    licence: CC BY 4.0 (UniProt)
    redistributable: true
    data_dir: uniprot/current
    properties:
      uniprot.organisms: "9606"
    postprocess: []
    load_first: true
    notes: >-
      load_first: its keys give Protein only md5checksum+organism, so loaded after humanmine-hgnc
      it made a second Protein per accession and isoforms ended with dangling canonicalProtein
      references (im-9n4.6).
      Swiss-Prot only (D-6): no TrEMBL file. With uniprot.organisms set, UniprotConverter takes
      only files named <taxon>_uniprot_sprot.xml (anything else is logged as a bad file and
      skipped), so the shared uniprot/current directory can also hold keywlist.xml and the
      varsplic FASTA. The human Swiss-Prot XML is 175 MB gzipped, not the 80 MB plan 50 estimated.
    files:
      - id: sprot
        url: https://ftp.ebi.ac.uk/pub/databases/uniprot/current_release/knowledgebase/taxonomic_divisions/uniprot_sprot_human.xml.gz
        verified: true
        size: 174683391
        last_modified: "2026-11-04"
        stage_as: 9606_uniprot_sprot.xml
        filter: {format: uniprot-xml, ids: uniprot}

  uniprot-keywords:
    type: uniprot-keywords
    jar: intermine
    licence: CC BY 4.0 (UniProt)
    redistributable: true
    data_dir: uniprot/current
    notes: >-
      The EBI mirror has only keywlist.xml.gz (keywlist.xml is a 404 there); project.xml's
      src.data.dir.includes=keywlist.xml picks the unpacked file out of the shared directory.
    files:
      - id: keywlist
        url: https://ftp.ebi.ac.uk/pub/databases/uniprot/current_release/knowledgebase/complete/docs/keywlist.xml.gz
        verified: true
        size: 155546
        last_modified: "2026-11-04"
        stage_as: keywlist.xml
        filter: none

  uniprot-fasta:
    type: fasta
    jar: intermine
    licence: CC BY 4.0 (UniProt)
    redistributable: true
    data_dir: uniprot/current
    properties:
      fasta.taxonId: "9606"
    after: [uniprot]
    notes: >-
      UniProtFastaLoaderTask takes fasta.includes=uniprot_sprot_varsplic.fasta and the
      organism from each header's OS= name. Isoforms only; the canonical sequences come from
      the Swiss-Prot XML.
    files:
      - id: varsplic
        url: https://ftp.ebi.ac.uk/pub/databases/uniprot/current_release/knowledgebase/complete/uniprot_sprot_varsplic.fasta.gz
        verified: true
        size: 8586697
        last_modified: "2026-11-04"
        stage_as: uniprot_sprot_varsplic.fasta
        filter: {format: fasta, ids: uniprot}

  go-annotation:
    type: go-annotation
    jar: intermine
    licence: CC BY 4.0 (GO Consortium, GOA)
    redistributable: true
    data_dir: go-annotation/current/human
    after: [uniprot, go]
    postprocess: [do-sources]
    notes: >-
      GoPostprocess is the source's own postprocess (do-sources). The plugin ignores project.xml's
      src.data.includes, so every file in the directory is read as GAF: stage nothing else there.
      Column 2 is a UniProt accession for human. The GO terms come from rdfc2im's go source,
      which replaces stock go.
    files:
      - id: gaf
        url: https://current.geneontology.org/annotations/goa_human.gaf.gz
        verified: true
        size: 15041996
        last_modified: "2026-05-28"
        stage_as: gene_association.goa_human
        filter: {format: gaf, ids: uniprot}

  ncbi-gff:
    type: ncbi-gff
    jar: intermine
    licence: public domain (NCBI RefSeq)
    redistributable: true
    data_dir: human/gff/current
    after: [ncbi-gene]
    postprocess: [create-chromosome-locations-and-lengths, create-gene-flanking-features,
                  create-location-overlap-index, create-overlap-view]
    priority_first: [Gene.chromosome]
    chromosome_lengths: {from: gff, source: ncbi-gff-lengths, data_dir: human/gff/lengths}
    notes: >-
      GFF3 converter default includes *.gff,*.gff3; seqids NC_000001.11 to NC_000024.10 are mapped
      to the chromosome names 1-22, X, Y (NcbiGffGFF3SeqHandler); MT (NC_012920.1) is not mapped,
      so its genes would get no location, and rows on alt and unplaced scaffolds (NT_, NW_) are
      dropped by the record handler. The filter keeps every ##sequence-region line, the panel genes
      (Dbxref GeneID) with their Parent closure (transcripts, exons, CDS). `keep_types: [gene]` in
      the filter would also keep every other gene row (the neighbours a genome browser shows, D-1):
      measured 18 Nov 2026 it adds 41,955 Genes and, through create-gene-flanking-features (20
      regions per gene), 0.84 million GeneFlankingRegions: 2.18 million objects instead of
      0.37 million, Postgres 4.3 GB instead of 2.0, integrate +45 s, postprocess +270 s (the
      search index most), and 2 duplicate symbols (RefSeq names some tRNA genes alike); left off
      until the thin genome comes from the RDF side (BUILD.md, "Locations and gene models"). Keys: Gene on
      primaryIdentifier (the Entrez id, from Dbxref GeneID), Chromosome on primaryIdentifier and
      organism, both what the rdfc2im sources write, so it merges loaded after them in project.xml
      order (no load_first). No loader sets Chromosome.length from a GFF, so
      `chromosome_lengths` adds the source ncbi-gff-lengths (type humanmine-items, after this one)
      loading the lengths that `subset_raw.py chromosome-lengths` reads from the filtered file's
      ##sequence-region lines [im-9n4.9]. RefSeq annotation release of Aug 2024.
    files:
      - id: gff
        url: https://ftp.ncbi.nlm.nih.gov/refseq/H_sapiens/annotation/GRCh38_latest/refseq_identifiers/GRCh38_latest_genomic.gff.gz
        verified: true
        size: 77807126
        last_modified: "2024-08-27"
        stage_as: GRCh38_latest_genomic.gff
        filter: {format: gff3, ids: entrez}

  ncbi-fasta:
    type: fasta
    jar: intermine
    licence: public domain (NCBI RefSeq)
    redistributable: true
    data_dir: human/fasta/current
    properties:
      fasta.taxonId: "9606"
    after: [ncbi-gene]
    needs: [ncbi-gff]
    postprocess: [create-chromosome-locations-and-lengths, transfer-sequences]
    notes: >-
      Optional: tools/full-build.sh --with-genome-sequence adds it (it needs ncbi-gff, whose
      locations transfer-sequences cuts the gene, transcript and exon sequences by). 973 MB
      gzipped. NCBIFastaLoaderTask names a record by the words after "chromosome" in its header
      ("mitochondrion" -> MT), so the alt, patch and unlocalized scaffolds of
      GRCh38_latest_genomic.fna ("chromosome 1 unlocalized genomic scaffold, ...") would become
      hundreds of extra Chromosome objects ("1 unlocalized genomic scaffold"); the filter keeps
      only the 24 records the ncbi-gff loader maps (ids: chromosomes, the NC_ accessions), about
      3.1 GB uncompressed, which also sets Chromosome.length (equal to the GFF's
      ##sequence-region values) [im-9n4.9; never run in the sandbox].
    files:
      - id: genome
        url: https://ftp.ncbi.nlm.nih.gov/refseq/H_sapiens/annotation/GRCh38_latest/refseq_identifiers/GRCh38_latest_genomic.fna.gz
        verified: true
        size: 972898531
        last_modified: "2024-08-27"
        stage_as: GRCh38_latest_genomic.fna
        filter: {format: fasta, ids: chromosomes}

  panther:
    type: panther
    jar: intermine
    licence: PANTHER terms of use, free with citation (unverified)
    redistributable: true
    data_dir: panther/current
    resolver_taxa: [10116, 7955]
    properties:
      panther.organisms: "9606"
    notes: >-
      Every file in the directory is parsed as tab-separated orthologues. A row is
      `HUMAN|HGNC=8620|UniProtKB=P26367  MOUSE|MGI=MGI=97490|UniProtKB=P63015  LDO  Euarchontoglires  PTHR45636`;
      the cut keeps a row when either gene cell holds a panel UniProt accession (subset_raw's tab filter reads
      the `UniProtKB=` token, [im-9n4.11]). The converter resolves only human, rat and zebrafish genes through
      the ID resolver (human by HGNC id to the Entrez id, as the primary identifier); mouse, fly, worm and yeast
      ids pass through as they are, and rat and fish ones too when the resolver has no file for them, so
      `resolver_taxa` has the build fetch NCBI's rat and zebrafish gene_info for the resolver. PANTHER 19 (Apr 2024).
    files:
      - id: orthologs
        url: https://data.pantherdb.org/ftp/ortholog/current_release/RefGenomeOrthologs.tar.gz
        verified: true
        size: 5932588
        last_modified: "2024-04-02"
        unpack: tar.gz
        member: RefGenomeOrthologs
        stage_as: RefGenomeOrthologs
        filter: {format: tab, ids: uniprot, column: "1,2"}

  mgi-identifiers:
    type: mgi-identifiers
    jar: intermine
    licence: MGI data are free to use with citation (Mouse Genome Informatics)
    redistributable: true
    data_dir: mgi-identifiers/current
    needs: [panther]      # its cut is the genes on panther's rows
    notes: >-
      Gives the mouse genes their symbol and name (panther creates them with an MGI id alone). The loader reads
      every row of MRK_List2.rpt (78 MB, about 70,000 markers) and makes a Gene of each marker of type Gene; the
      cut keeps the rows of the genes on PANTHER rows with a panel gene (`subset_raw.py partner-ids` writes
      idsets/mgi.txt from the filtered PANTHER file, so panther is cut first). Column 1 is `MGI:97490`.
    files:
      - id: markers
        url: https://www.informatics.jax.org/downloads/reports/MRK_List2.rpt
        verified: true
        size: 78776476
        last_modified: "2026-11-16"
        stage_as: MRK_List2.rpt
        filter: {format: tab, ids: mgi, column: "1"}

  rgd-identifiers:
    type: rgd-identifiers
    jar: intermine
    licence: RGD data are free to use with citation (Rat Genome Database)
    redistributable: true
    data_dir: rgd-identifiers/current
    needs: [panther]      # its cut is the genes on panther's rows
    notes: >-
      As mgi-identifiers, for rat: GENES_RAT.txt, column 1 the bare RGD number (the loader makes `RGD:<n>`).
      Not verified: download.rgd.mcw.edu is behind this sandbox's firewall (HTTP 403, approval needed), so the
      URL is HumanMine's own and was never fetched here.
    files:
      - id: genes
        url: https://download.rgd.mcw.edu/data_release/GENES_RAT.txt
        verified: false
        stage_as: GENES_RAT.txt
        filter: {format: tab, ids: rgd, column: "1", keep_header: true}

  psi-intact:
    type: psi
    jar: intermine
    licence: CC BY 4.0 (IntAct, EMBL-EBI)
    redistributable: true
    data_dir: psi/intact/current
    properties:
      intact.organisms: "9606"
    after: [psi-mi-ontology]
    notes: >-
      1.06 GB zip of PSI-MI XML files (member layout unverified; unpacked size unknown, likely
      several GB: needs the data root on the large disk). No PSI XML filter exists yet, so the
      cut is the resolver gate (T0.3), which keeps panel-to-panel pairs only (plan 50 2.2).
    files:
      - id: human
        url: https://ftp.ebi.ac.uk/pub/databases/intact/current/psi25/species/human.zip
        verified: true
        size: 1061726001
        last_modified: "2026-10-24"
        unpack: zip
        member: "*.xml"
        filter: none

  biogrid:
    type: biogrid
    jar: intermine
    licence: MIT (BioGRID; unverified)
    redistributable: true
    data_dir: biogrid/current
    properties:
      biogrid.organisms: "9606"
    after: [psi-mi-ontology]
    notes: >-
      The converter needs the BIOGRID-ORGANISM-<Genus_species>-<version>.psi25.xml file name
      layout (it reads the organism out of it). The server sends no Content-Length; over 140 MB.
      Resolver gate (T0.3).
    files:
      - id: organisms
        url: https://downloads.thebiogrid.org/Download/BioGRID/Latest-Release/BIOGRID-ORGANISM-LATEST.psi25.zip
        verified: true
        last_modified: "2026-11-17"
        unpack: zip
        member: "BIOGRID-ORGANISM-Homo_sapiens-*.psi25.xml"
        filter: none

  psi-mi-ontology:
    type: psi-mi-ontology
    jar: intermine
    licence: CC BY 4.0 (HUPO-PSI; unverified)
    redistributable: true
    data_dir: psi/ontology/current
    data_property: src.data.file
    data_file: psi-mi.obo
    files:
      - id: obo
        url: https://purl.obolibrary.org/obo/mi.obo
        verified: true
        size: 744253
        stage_as: psi-mi.obo
        filter: none

  protein-atlas:
    type: protein-atlas
    jar: humanmine-bio-sources
    licence: CC BY-SA 3.0 in the converter (HPA now states 4.0; share-alike)
    redistributable: true
    data_dir: metabolic/protein-atlas/current
    notes: >-
      HPA renamed normal_tissue.tsv.zip to normal_ihc_data.tsv.zip (the old name is a 404);
      staged under the name the converter accepts. Any other file in the directory makes the
      converter throw. Column layout of the renamed file against the 2022 converter: unverified.
      The member name inside the zip is assumed.
    files:
      - id: normal
        url: https://www.proteinatlas.org/download/tsv/normal_ihc_data.tsv.zip
        verified: true
        size: 5617166
        last_modified: "2026-11-10"
        unpack: zip
        member: normal_ihc_data.tsv
        stage_as: normal_tissue.tsv
        filter: {format: tab, ids: ensembl, column: "1", keep_header: true}

  protein-atlas-rna:
    type: protein-atlas-rna
    jar: humanmine-bio-sources
    licence: CC BY-SA 3.0 in the converter (HPA now states 4.0; share-alike)
    redistributable: true
    data_dir: metabolic/protein-atlas/RNA-seq/current
    notes: >-
      The converter accepts only a file named rna_tissue.tsv (anything else throws): col 1
      Ensembl gene, col 3 tissue, col 4 nTPM, which rna_tissue_consensus.tsv has. Member name
      inside the zip assumed.
    files:
      - id: consensus
        url: https://www.proteinatlas.org/download/tsv/rna_tissue_consensus.tsv.zip
        verified: true
        size: 5293680
        last_modified: "2026-11-10"
        unpack: zip
        member: rna_tissue_consensus.tsv
        stage_as: rna_tissue.tsv
        filter: {format: tab, ids: ensembl, column: "1", keep_header: true}

  gtex:
    type: gtex
    jar: humanmine-bio-sources
    licence: GTEx open-access summary data
    redistributable: true
    data_dir: human/GTEx/current
    notes: >-
      The converter reads a file whose name contains gene_median, but only after a header row
      whose first cell is gene_id; the v8 GCT header says Name, so HumanMine's 2022 copy was
      probably edited (unverified). Gene ids carry a version suffix, which subset_raw's tab
      filter does not strip, so the cut is the resolver gate (T0.3). eQTLs (1.5 GB) are left out.
    files:
      - id: median
        url: https://storage.googleapis.com/adult-gtex/bulk-gex/v8/rna-seq/GTEx_Analysis_2017-06-05_v8_RNASeQCv1.1.9_gene_median_tpm.gct.gz
        verified: true
        size: 6952331
        last_modified: "2023-03-20"
        stage_as: GTEx_Analysis_2017-06-05_v8_RNASeQCv1.1.9_gene_median_tpm.gct
        filter: none

  atlas-express:
    type: atlas-express
    jar: humanmine-bio-sources
    licence: CC BY 4.0 (Expression Atlas, EMBL-EBI)
    redistributable: true
    data_dir: atlas-express
    notes: >-
      Every file in the directory is read as a tab file with a header row, col 1 Ensembl gene id.
      The experiment's TPM table from the Atlas FTP area (the /gxa/experiments-content URL is a
      404); the file HumanMine loaded in 2014 is not known.
    files:
      - id: tpms
        url: https://ftp.ebi.ac.uk/pub/databases/microarray/data/atlas/experiments/E-MTAB-513/E-MTAB-513-tpms.tsv
        verified: true
        size: 12909800
        last_modified: "2021-12-14"
        stage_as: E-MTAB-513-tpms.tsv
        filter: {format: tab, ids: ensembl, column: "1", keep_header: true}

  hpo-annotation:
    type: hpo-annotation
    jar: humanmine-bio-sources
    licence: HPO licence (reuse with attribution, terms not to be altered; unverified for a filtered copy)
    redistributable: true
    data_dir: hpo/current
    needs: [omim]
    properties:
      hpo.disease.file: "{data_root}/metabolic/omim/current/mimTitles.txt"
    notes: >-
      The 2022 converter requires phenotype_annotation.tab and phenotype_annotation_negated.tab,
      which HPO no longer publishes (phenotype.hpoa replaced them, in another layout), and
      hpo.disease.file (OMIM mimTitles.txt, hence needs omim). Loading it needs converter work
      first (plan 50 section 3); the hpoa staging below is a placeholder (verified: false).
    files:
      - id: genes-to-phenotype
        url: https://purl.obolibrary.org/obo/hp/hpoa/genes_to_phenotype.txt
        verified: true
        size: 20821704
        last_modified: "2026-09-02"
        stage_as: genes_to_phenotype.txt
        filter: {format: tab, ids: entrez, column: "1", keep_header: true}
      - id: hpoa
        url: https://purl.obolibrary.org/obo/hp/hpoa/phenotype.hpoa
        verified: false
        size: 35816037
        last_modified: "2026-09-02"
        stage_as: phenotype.hpoa
        filter: none

  orphanet:
    type: orphanet
    jar: humanmine-bio-sources
    licence: CC BY 4.0 (Orphanet)
    redistributable: true
    data_dir: human/orphanet/current
    notes: Disorder codes and names only, no gene ids, so no filter. Any other file in the directory throws.
    files:
      - id: product1
        url: https://www.orphadata.com/data/xml/en_product1.xml
        verified: true
        size: 54026799
        last_modified: "2026-06-29"
        stage_as: en_product1.xml
        filter: none

  omim:
    type: omim
    jar: intermine
    licence: OMIM licensed download (personal or institutional use only)
    redistributable: false
    local_copy: required
    data_dir: metabolic/omim/current
    notes: >-
      D-7: only from Gos's local copy (--stock-local DIR, DIR/omim/<file>), never downloaded,
      never in cached_raw_data/ or the CI release asset. All three files are required by the
      converter. Resolver gate (T0.3) on the morbidmap symbols.
    files:
      - id: titles
        url: null
        raw_name: mimTitles.txt
        stage_as: mimTitles.txt
        filter: none
      - id: morbidmap
        url: null
        raw_name: morbidmap.txt
        stage_as: morbidmap.txt
        filter: none
      - id: pubmed-cited
        url: null
        raw_name: pubmed_cited
        stage_as: pubmed_cited
        filter: none

  interpro-go:
    type: interpro-go
    jar: intermine
    licence: CC0 (InterPro)
    redistributable: true
    data_dir: interpro/ontology/current
    files:
      - id: interpro2go
        url: https://ftp.ebi.ac.uk/pub/databases/interpro/current_release/interpro2go
        verified: true
        size: 3057468
        last_modified: "2026-11-04"
        stage_as: interpro2go
        filter: none
