  pubmed-gene:
    type: pubmed-gene
    jar: intermine
    licence: "No restrictions by NCBI (NCBI data-use policy; no licence named)"
    licence_status: verified
    licence_url: "https://www.ncbi.nlm.nih.gov/home/about/policies/"
    licence_checked: "2026-11-20"
    licence_quote: "NCBI itself places no restrictions on the use or distribution of the data contained therein."
    licence_conditions:
      - "No licence is named and NCBI asks for no attribution for the data. The policy adds: \"some submitters of the original data (or the country of origin of such data) may claim patent, copyright, or other intellectual property rights in all or a portion of the data\"."
      - "gene2pubmed is NCBI's own derived table (\"the logical equivalent of what is reported as Gene/PubMed Links\", README of ftp.ncbi.nlm.nih.gov/gene/DATA/, read 2026-11-20); it holds identifiers only, no abstract or title."
      - "For NCBI's own web pages (public domain): \"it is requested that in any subsequent use of this work, NLM be given appropriate acknowledgment\"."
    redistributable: true
    redistributable_reason: "NCBI places no restrictions on use or distribution of its data; the file is identifiers only."
    data_dir: pubmed/current
    properties:
      pubmed.organisms: "9606"
    notes: >-
      gene2pubmed (291 MB gzipped, every NCBI taxon, updated daily: Last-Modified 19 Nov 2026) is cut to the rows of
      the panel's Entrez gene ids (column 2); the taxon column is not needed, an Entrez id belongs to one taxon.
      The loader resolves each gene through the ID resolver (the all-human gene_info), creates a Publication per
      PubMed id (pubMedId only) and adds it to Gene.publications. The titles, authors and abstracts of those
      Publications come from update-publications (E-utilities) or, where the rdfc2im pubmed source loaded the
      same id, from RDF Portal. HumanMine's own value is "9606 10090"; mouse genes are not resolved here, so 9606.
    files:
      - id: gene2pubmed
        url: https://ftp.ncbi.nlm.nih.gov/gene/DATA/gene2pubmed.gz
        verified: true
        size: 290749084
        last_modified: "2026-11-19"
        stage_as: gene2pubmed
        filter: {format: tab, ids: entrez, column: "2"}

  # humanmine-static (HumanMine's datasets.xml, intermine/humanmine-datasets e7a86ea of 11 Feb 2022) was here: retired
  # [im-9n4.52]. Of its 40 DataSets 34 matched nothing this build loads, and every version was of 2021-22. DataSet.version
  # comes from the build's caches and the accurate DataSource urls from the stock mapping files (data_source_url), through
  # the data-set-links source (tools/source_pages.py data-set-links); rdfc2im/stock.py RETIRED says so to a list naming it.

  update-data-sources:
    type: update-data-sources
    jar: intermine
    licence: "CC-BY-4.0"
    licence_status: verified
    licence_url: "https://ftp.ebi.ac.uk/pub/databases/uniprot/current_release/knowledgebase/complete/README"
    licence_checked: "2026-11-20"
    licence_quote: "We have chosen to apply the Creative Commons Attribution 4.0 International (CC BY 4.0) License (https://creativecommons.org/licenses/by/4.0/) to all copyrightable parts of our databases."
    licence_conditions:
      - "Attribution: credit the UniProt Consortium. dbxref.txt (the list of cross-referenced databases, with their URLs) is in the docs directory of the same release tree and has no licence line of its own."
    redistributable: true
    redistributable_reason: "CC BY 4.0 allows redistribution with attribution (the file is used whole)."
    data_dir: uniprot/xrefs/current
    data_property: none        # project.xml keeps src.data.file=datasources.xml (written by the source's own pre-retrieve step)
    after: [uniprot]
    reads_mine: true           # reads the DataSource names every loader stored: integrates after all of them [im-9n4.56]
    notes: >-
      A two-step source: DataSourceUpdater (the pre-retrieve step of `integrate -Psource=update-data-sources`)
      reads UniProt's dbxref.txt (project.xml `dataSourceFile`), takes every DataSource name in the mine
      (os.production) that equals an `Abbrev:` of dbxref.txt (release 2026_04 lists a few hundred databases) and
      writes datasources.xml with that database's `Name:` as DataSource.description, its `Server:` as url and the
      PubMed id of its `Ref:` as a Publication, which is then loaded. A DataSource whose name is no UniProt
      abbreviation (this mine's "NCBI", "The Mouse genome database ...") is not touched. It must run after the
      sources that make the DataSources (HumanMine lists it last). The 56,258-byte dbxref.txt is used whole.
    files:
      - id: dbxref
        url: https://ftp.ebi.ac.uk/pub/databases/uniprot/current_release/knowledgebase/complete/docs/dbxref.txt
        verified: true
        size: 56258
        last_modified: "2026-11-04"
        stage_as: dbxref.txt
        filter: none

  update-publications:
    type: update-publications
    jar: intermine
    licence: "NLM terms and conditions (acknowledge NLM; no endorsement; currency statement for redistributed data)"
    licence_status: partial
    licence_url: "https://www.nlm.nih.gov/databases/download/terms_and_conditions.html"
    licence_checked: "2026-11-20"
    licence_quote: "Users of the data agree to: acknowledge NLM as the source of the data by including the phrase \"Courtesy of the U.S. National Library of Medicine\" in a clear and conspicuous manner, not indicate or imply that NLM has endorsed its products/services/application."
    licence_conditions:
      - "The same page: \"No charges, usage fees or royalties are paid to NLM for this data.\" and \"Users who republish or redistribute the data (services, products or raw data) agree to: maintain the most current version of all distributed data, or make known in a clear and conspicuous manner that the products/services/applications do not reflect the most current/accurate data available from NLM.\""
      - "\"NLM does not provide legal advice regarding copyright, fair use, or other aspects of intellectual property rights\": abstracts and titles remain the publishers' text (not read: the NLM copyright page now redirects to web_policies.html, which was not found to say more)."
      - "Partial: the page above governs downloads from NLM's FTP servers; the E-utilities usage policy (https://www.ncbi.nlm.nih.gov/books/NBK25497/, 3 requests a second without an API key, an e-mail and tool name sent) answered with a reCAPTCHA page and eutils.ncbi.nlm.nih.gov itself is blocked from the sandbox (HTTP 403, approval required), so the terms of the service the loader calls were not read."
    redistributable: true
    redistributable_reason: "No stated term forbids a filtered copy; nothing is cached (the source reads the mine and E-utilities at build time and stores no raw file)."
    data_property: none
    # every source that writes Publications: update-data-sources writes one per database paper (dbxref.txt Ref:),
    # which HumanMine's project.xml order (update-publications first) left with no title [im-9n4.56]
    after: [pubmed-gene, update-data-sources]
    reads_mine: true           # reads the pubMedId of every Publication the loaders stored
    notes: >-
      A two-step source (the pre-retrieve step of `integrate -Psource=update-publications`): EntrezPublicationsRetriever
      reads the pubMedId of every Publication in the mine (os.production), asks NCBI's E-utilities (esummary, or
      efetch with loadFullRecord=true for abstracts) in batches of 500 and writes publications.xml, which is loaded
      to give Publication its title, authors, year, journal, pages and abstract. It needs network at build time:
      `sbx policy allow network eutils.ncbi.nlm.nih.gov` (HTTP 403 "Approval required" on 20 Nov 2026). It must
      run after every source that makes Publications (HumanMine lists it last). No upstream file.
    files: []

  entrez-organism:
    type: entrez-organism
    jar: intermine
    licence: "No restrictions by NCBI (NCBI data-use policy; no licence named)"
    licence_status: partial
    licence_url: "https://www.ncbi.nlm.nih.gov/home/about/policies/"
    licence_checked: "2026-11-20"
    licence_quote: "NCBI itself places no restrictions on the use or distribution of the data contained therein."
    licence_conditions:
      - "The policy page covers NCBI's databases (the Taxonomy records the loader reads are one); no licence is named and no attribution is asked for the data."
      - "Partial: the E-utilities usage policy (rate limit, identification) answered with a reCAPTCHA page and eutils.ncbi.nlm.nih.gov is blocked from the sandbox (HTTP 403, approval required), so the terms of the service itself were not read."
    redistributable: true
    redistributable_reason: "NCBI places no restrictions on use or distribution of its data; nothing is cached."
    data_property: none
    after: [update-publications]
    reads_mine: true           # reads the taxonId of every Organism the loaders stored
    notes: >-
      A two-step source (the pre-retrieve step of `integrate -Psource=entrez-organism`): EntrezOrganismRetriever reads
      the taxon id of every Organism in the mine, asks E-utilities (esummary, db=taxonomy) for its names and writes
      organisms.xml, loaded to give Organism name, genus, species and shortName. Needs network at build time (host
      eutils.ncbi.nlm.nih.gov, blocked on 20 Nov 2026); must run after every source that makes Organisms. No upstream file.
    files: []
