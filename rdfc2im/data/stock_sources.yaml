      panel's PANTHER rows (`subset_raw.py partner-ids`, idsets/mgi.txt: the marker is column 7, 6 and 6). The
      loader makes a Gene `MGI:<n>` for each allele's marker, the key panther gives its mouse genes, so the two
      merge. The converter reads MGI's current layouts (PhenotypicAllele 13 columns, phenotype ids in column 11; QTLAllele
