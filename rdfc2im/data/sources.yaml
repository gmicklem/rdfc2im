gwascatalog:
  replaces: [huge-gwas]
  data_source_name: GWAS Catalog
  # Fetched via TogoVar's own SPARQL endpoint, not RDF Portal - see the Endpoint: comment in
  # out/gwascatalog/queries/*.sparql - so the provenance link is TogoVar's own site.
  data_source_url: https://togovar.org/
  data_set_title: GWAS Catalog (TogoVar)
  citation_pmid: "39530240"
  citation_evidence: "https://www.ebi.ac.uk/gwas/docs/citation/ (read 2026-11-20): \"To cite the NHGRI-EBI GWAS Catalog, data or visualisations therein, please use our latest NAR update paper: Cerezo M ... doi.org/10.1093/nar/gkae1070\" (PMID by E-utilities esearch on that DOI). The data come through TogoVar, whose terms (github.com/togovar/togovar terms.pug) ask also for the TogoVar article (PMID 36509753) and say this \"does not replace any terms or citation requirements specified by each provider\"."
  licence: "EMBL-EBI terms of use (summary statistics CC0)"
  licence_status: partial
  licence_url: "https://www.ebi.ac.uk/gwas/docs/about"
  licence_checked: "2026-11-18"
  licence_quote: "The NHGRI-EBI GWAS Catalog and all its contents are available under the general Terms of Use for EMBL-EBI Services. Summary statistics are made available under CC0 unless otherwise stated."
  licence_conditions:
    - "This build reads the associations through TogoVar's SPARQL endpoint. TogoVar's own terms (https://togovar.org/doc/terms) sit behind a Cloudflare bot check (\"Just a moment\" to a plain client, \"Performing security verification\" to a browser, 2026-11-18, second pass). The proxy allows the host; the site refuses automated readers, and the check was not worked around. A person can read the page in an ordinary browser."
    - "Cite the GWAS Catalog (citation page linked from the about page)."
  redistributable: true
  redistributable_reason: "EMBL-EBI adds no restriction beyond the data owner's; TogoVar's terms are unread, so partial."
  rdfportal_licence_note: "RDF Portal lists no data set page for this source (rdfportal.org/dataset/gwas_catalog answers 404)."
  # No source-level Organism constant: nothing on the root, GWASResult, can hold an organism, so it
  # loaded unlinked.  The organism is declared where it belongs - SNP.organism and Gene.organism -
  # on the terms:snps and terms:mapped_genes entries in knowledge.yaml.
  accepted_gaps:
    GWAS.firstAuthor:
      basis: data:togovar
      reason: >-
        Not in the RDF: no gwas:Study or gwas:Association at grch38.togovar.org has an author
        predicate (every Study predicate, and those of a 2,000-association sample, listed
        2026-09-17).  The first author stays reachable as GWAS.publication.firstAuthor, which
        update-publications (loadFullRecord) fills.
    GWASResult.source:
      basis: java:HugeGwasConverter
      reason: declared in huge-gwas_additions.xml, never set by the converter
    Source:
      basis: java:HugeGwasConverter
      reason: declared in huge-gwas_additions.xml, never created by the converter
  gene_scope_field: secondaryIdentifier
  # [im-9n4.59] its snp_gene_ids are Ensembl gene ids: a panel build restricts by the ensembl
  # selection (the cross-reference join's genes for the panel's NCBI genes, from hgnc and ncbigene's
  # items and Ensembl's own xrefs; the same lookup answer), never by label
  gene_scope_resolver: xref_join
  gene_scope_xref_sources: [hgnc, ncbigene]
  scope: good
clinvar:
  replaces: [clinvar]
  data_source_name: ClinVar
  data_source_url: https://rdfportal.org/dataset/clinvar
  data_set_title: ClinVar (RDF Portal)
  citation_note: "No citation recorded: the ClinVar FTP README and its GitHub README state none, and ClinVar's documentation (www.ncbi.nlm.nih.gov/clinvar/docs, /clinvar/intro) answers the sandbox with a reCAPTCHA page (20 Nov 2026)."
  data_set_licence: "https://www.ncbi.nlm.nih.gov/home/about/policies/"
  licence: "No restrictions by NCBI (NCBI data-use policy); ClinVar's own data-use page unread"
  licence_status: partial
  licence_url: "https://www.ncbi.nlm.nih.gov/home/about/policies/"
  licence_checked: "2026-11-18"
  licence_quote: "NCBI itself places no restrictions on the use or distribution of the data contained therein."
  licence_conditions:
    - "No licence is named and NCBI asks for no attribution for the data. The policy (Molecular Data Usage) adds: \"some submitters of the original data (or the country of origin of such data) may claim patent, copyright, or other intellectual property rights in all or a portion of the data\"; NCBI \"cannot provide comment or unrestricted permission concerning the use, copying, or distribution of the information contained in the molecular databases\"."
    - "For NCBI's own web pages (public domain): \"it is requested that in any subsequent use of this work, NLM be given appropriate acknowledgment\". Giving that acknowledgement is cheap and the notice files do it."
    - "The server notice (https://ftp.ncbi.nlm.nih.gov/README.ftp) agrees: \"ALL DATA HERE IS PUBLIC, NON-SENSITIVE, UNRESTRICTED SCIENTIFIC DATA SHARING AMONG SCIENTIFIC COMMUNITIES.\""
    - "ClinVar's own data-use page (https://www.ncbi.nlm.nih.gov/clinvar/docs/maintenance_use/, the one RDF Portal names) was not read: the host answered with a reCAPTCHA page to a plain client and \"Checking your browser before accessing www.ncbi.nlm.nih.gov\" to a browser. That is NCBI's bot check, not the sandbox policy, and was not worked around. The ClinVar FTP README (https://ftp.ncbi.nlm.nih.gov/pub/clinvar/README.txt) states no licence. Retried 2026-11-20 (HTTP 200, same \"Checking your browser before accessing www.ncbi.nlm.nih.gov\" page, no text); the FTP README was re-read the same day and still holds no terms. Status stays partial."
  redistributable: true
  redistributable_reason: "NCBI's general policy places no restrictions on molecular data; ClinVar's own page, which may add a submitter notice, was not readable."
  rdfportal_licence: "https://www.ncbi.nlm.nih.gov/clinvar/docs/maintenance_use/"
  rdfportal_licence_url: "https://rdfportal.org/dataset/clinvar/"
  rdfportal_licence_note: "RDF Portal's page gives ClinVar's data-use page as the licence; NCBI's bot check stopped a read of that page on 2026-11-18."
