ensembl:
  replaces: []
  data_source_name: Ensembl
  data_source_url: https://rdfportal.org/dataset/ensembl
  data_set_title: Ensembl genes (RDF Portal)
  citation_pmid: "39656687"
  citation_evidence: "https://jun2026.archive.ensembl.org/info/about/publications.html (the redirect of www.ensembl.org/info/about/publications.html, read 2026-11-20): \"If you've used Ensembl in your work, please cite the most recent overview article and the Ensembl release you retrieved your data from (currently 116)\": Dyer SC et al., Ensembl 2025, Nucleic Acids Res 2025 (PMID 39656687)."
  licence: "No restrictions by Ensembl (disclaimer); Ensembl code Apache-2.0; third-party constraints may apply"
  licence_status: verified
  licence_url: "https://jun2026.archive.ensembl.org/info/about/legal/disclaimer.html"
  licence_checked: "2026-11-20"
  data_set_licence: "https://www.ensembl.org/info/about/legal/disclaimer.html"
  licence_quote: "Ensembl imposes no restrictions on access to, or use of, the data provided and the software used to analyse and present it. Ensembl data generated by members of the project are available without restriction."
  licence_conditions:
    - "Read 2026-11-20 (UTC): RDF Portal's data set page (https://rdfportal.org/dataset/ensembl/; Ensembl release 115, issued 2026-02-27) names http://ensembl.org/info/about/legal/disclaimer.html as the licence. That URL redirects (HTTP 200 after redirect) to https://jun2026.archive.ensembl.org/info/about/legal/disclaimer.html (Ensembl release 116, June 2026), read in full; the legal index there lists the disclaimer, name and logo policy, mirror policy, image reuse, software licence and genome browser agreement."
    - "Third-party data: \"Some of the data and software included in the distribution may be subject to third-party constraints. Users of the data and software are solely responsible for establishing the nature of and complying with any such restrictions.\" Any third-party content that a mine shows must be checked against its provider."
    - "Code: \"Ensembl code written by members of the project is provided under the Apache 2.0 licence.\" (not used here: only data are loaded)"
    - "No attribution or citation duty is stated on the disclaimer page; citing Ensembl is good practice (https://www.ensembl.org/info/about/cite.html was not read). EMBL-EBI gives the data \"in good faith\", with no warranty."
    - "The disclaimer was read on release 116's archive host; RDF Portal holds release 115. The page read is the one RDF Portal names (www.ensembl.org redirects to the archive host)."
  redistributable: true
  redistributable_reason: "The disclaimer states no restriction on use of Ensembl data and that Ensembl-generated data are available without restriction; a filtered copy of Ensembl's own annotation may go in a public release asset. Third-party content inside the distribution is the user's responsibility (the page says so)."
  rdfportal_licence: "http://ensembl.org/info/about/legal/disclaimer.html"
  rdfportal_licence_url: "https://rdfportal.org/dataset/ensembl/"
  rdfportal_licence_note: "RDF Portal's page gives Ensembl's disclaimer page as the licence."
  consts: {Organism.taxonId: "9606"}
  gene_scope_field: secondaryIdentifier
  # [im-9n4.59] A gene-panel build fetches the Ensembl genes that the cross-reference join below puts
  # on the panel's NCBI genes (HGNC's Ensembl id, then NCBI's, then Ensembl's own ncbigene xref:
  # cli.source_gene_ids, scope.ensembl_xref_resolver), not the first gene labelled with the panel
  # symbol: that was ENSG00000242366 (UGT1A8) for UGT1A1, whose own gene is ENSG00000241635.
  gene_scope_resolver: xref_join
  # Ensembl's RDF tags alternative-haplotype genes (GSTT1's ENSG00000277656) with this organism, not
  # taxonomy:9606: a run restricted to gene ids accepts it too (scope.widen_organisms); the constant
  # below still gives the gene taxon 9606. An unscoped fetch is not widened [im-9n4.59].
  gene_scope_organism_also: ["<http://ensembl.org/Homo_sapiens>"]
  # Shown with the data set (DataSet.description after the status-page sentence, and the Notes row
  # of its status page); the numbers come from this build's join report [im-9n4.59].
  data_set_note: "Ensembl genes are loaded only where HGNC, NCBI or Ensembl gives a one-to-one cross-reference to an NCBI gene in this mine; the others are left out."
  data_set_note_counts: "{not_joined:,} of {total:,} Ensembl genes in this build's scope were not loaded for that reason."
  # [im-9n4.55] Its genes have an Ensembl id and a label but no Entrez id, and with the type's
  # Gene keys they merged into whatever gene had the same symbol or Ensembl id: at full scope 845
  # labels are shared by several Ensembl genes (haplotype copies, PAR genes, Y_RNA, ...), and by
  # symbol ENSG00000242366 (labelled UGT1A1, UGT1A8 by its own description) went onto UGT1A1 even
  # in the panel.  Gos Micklem, 20 Nov 2026: "Match on a stable cross-reference instead".
  # items.join_on_xref gives each the Entrez id that HGNC, then NCBI (their written items, so the
  # Ensembl id each gene will show), then Ensembl's own rdfs:seeAlso ncbigene name, one-to-one at
  # the level that decides; the rest are left out of the build (unmatched: drop) and listed in
  # out/ensembl/items/ensembl_xref_join.tsv.  `unmatched: keep` would load them as Genes keyed on
  # their Ensembl id instead (BUILD.md, "Ensembl genes by cross-reference").  Needs ncbigene and
  # hgnc before ensembl in --sources (the default order).
  xref_join:
    class: Gene
    id_field: secondaryIdentifier
    key: primaryIdentifier
    sources: [hgnc, ncbigene]
    own: {table: main_ensg_xref, id: ensg_id, xref: ensg_xref, prefix: "http://identifiers.org/ncbigene/"}
    unmatched: drop
  # Then merge on the Entrez id alone, as ncbigene and hgnc (project.source_keys).
  own_keys: {Gene: [primaryIdentifier]}
  # A label several joined Ensembl genes share goes from all of them; a symbol or Ensembl id
  # ncbigene or hgnc gives to another Entrez gene is dropped (they rank first for both fields).
  key_ambiguity:
    Gene: [{field: symbol}, {field: secondaryIdentifier}]
  defer_to:
    ncbigene: {class: Gene, key: primaryIdentifier, fields: [symbol, secondaryIdentifier]}
    hgnc: {class: Gene, key: primaryIdentifier, fields: [symbol, secondaryIdentifier]}
  scope: good
  note: not a HumanMine source today; supplies Ensembl ids/biotypes/locations that ncbi-gene lacks
  # Confirmed live: adding FROM <.../dataset/ensembl> to a query combining a VALUES clause with
  # the obo:RO_0002162 taxonomy filter makes rdfportal.org/ebi/sparql return zero rows for genes
  # that do exist (e.g. CYP2D6's ENSG00000165841, isolated and reproduced directly against the
  # endpoint) - some graph-scoping interaction specific to this endpoint's Virtuoso instance, not
  # a correctness issue with the pattern itself. resolve_ensembl_symbols (scope.py) already omits
  # FROM for exactly this reason; the real generated fetch query didn't, and silently fetched 0
  # rows for all 4 of ensembl's tables on the first real run. use_from: false is per-source so
  # every other source keeps FROM (needed to disambiguate results on RDF Portal's shared
  # multi-dataset endpoint) - only ensembl's own endpoint has this quirk.
  use_from: false
