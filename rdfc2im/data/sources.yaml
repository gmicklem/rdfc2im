reactome:
  # Alongside, not a replacement: stock reactome's whole value is Pathway.proteins/genes and their
  # reverses, which this source never writes.  Pathway merges on identifier (R-HSA-... in both);
  # this source adds descriptions.
  replaces: []
  alongside: [reactome]
  data_source_name: Reactome
  data_source_url: https://rdfportal.org/dataset/reactome
  # The stock reactome source's own data set title, so the Pathway items of both sources join ONE
  # data set (DataSet merges on name).  Under a title of our own ("Reactome pathways (RDF Portal)")
  # every pathway sat in two data sets: each enrichment row of pathway_enrichment appeared twice and
  # a data set filter matched half of them.  im-ore.10.
  data_set_title: Reactome pathways data set
  data_set_licence: "https://creativecommons.org/publicdomain/zero/1.0/"
  licence: "CC0-1.0"
  licence_status: verified
  licence_url: "https://reactome.org/license"
  licence_checked: "2026-11-18"
  licence_quote: "All data in the Reactome database and files derived from that data are licensed under the Creative Commons Public Domain Dedication (CC0)."
  licence_conditions:
    - "Attribution encouraged, not required. Reactome's pathway illustrations, icons and branding are CC BY 4.0 and its software Apache-2.0 (not used)."
  redistributable: true
  redistributable_reason: "CC0 allows redistribution without conditions."
  rdfportal_licence: "Creative Commons Public Domain (CC0) License"
  rdfportal_licence_url: "https://rdfportal.org/dataset/reactome/"
