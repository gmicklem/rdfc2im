# Per-source settings for the rdf-config sources in scope.
#
#   licence, licence_status, licence_url, licence_checked, licence_quote, licence_conditions, redistributable,
#              redistributable_reason: the upstream's licence as the upstream states it, read on licence_checked
#              (same keys as stock_sources.yaml; written for the ten sources of the demo build). rdfportal_licence,
#              rdfportal_licence_url, rdfportal_licence_note: what RDF Portal's own data set page states, where it
#              differs or is a bare link. The record of every source is docs/LICENCES.md.
#   replaces:  project.xml <source name=...> entries that the rdf-config load supersedes
#              (moved to replaced_sources.xml by `rdfc2im project`); [] = adds data, replaces nothing
#   alongside: stock sources this one supplements rather than replaces.  It loads right after them,
#              merges into their objects through the integration keys, and genomic_priorities
#              lists the stock source first for every field it writes, so existing values stand.
#              Use it when the stock source loads things this one cannot (replaced_coverage).
#   accepted_gaps: what a replaced source declares that this one never writes, and why that is
#              not a loss ({Class.field or Class: {basis, reason}}).  `check` fails on any other gap.
#   consts:    constant columns appended to every table of the source (Class.field: value)
#   roots:     which model.yaml subjects start a table set (default: the first subject)
#   data_source_name / data_set_title: what the delimited loader writes into DataSource/DataSet
#   model_additions: predicates the upstream model.yaml lacks, per subject, in model.yaml's own grammar
#              (rdfconfig.add_predicates); they then get mapping rows like any other
#   node_constraints: SPARQL lines emitted in a subject's own block of every query that reaches it
#              ({var} = its variable, {root} = the root's); inside an OPTIONAL they narrow what it binds
#   own_keys:  the keys this source merges each class on (project.source_keys): the type's keys of
#              that class cut to these fields, or this key alone where no keys file declares one
#   data_set_licence: optional URL written to DataSet.licence (items.py [im-9n4.45]): the licence page or text the
#              upstream states, only where the licence_status of the record is verified or partial; none for
#              ensembl and gwascatalog (unverified). The record itself is licence_url / licence_quote above.
#   types:     which nodes get an `a <type>` triple in the generated SPARQL: root | union | all
#   distinct:  add DISTINCT to the SELECT (default true)
#   scope:     good | structural | blocked  (spec section 8 achievability class)
#   gene_scope_field: the Gene.<field> `--genes` restricts this source by (scope.py
#              apply_gene_scope) - must be a field this source maps with required=yes, so the
#              restriction reaches every table, not just the one that happens to carry a label.
#              Only meaningful together with a resolver that turns a gene symbol into this
#              source's own scheme (see scope.py's resolve_ncbigene_symbols for the reference
#              one); a source with no resolver wired up is skipped, same as an unsupported
#              --taxon, rather than silently ignoring the restriction.
#   gene_scope_resolver: xref_join = a gene-panel build picks this source's genes by the
#              cross-reference join (`xref_join`) to the panel's NCBI genes, not by symbol (ensembl)
#   data_set_note: plain sentence(s) a user should read with the data set: written into
#              DataSet.description after the status-page sentence (tools/source_pages.py
#              data-set-links) and shown as the Notes row of the status page.  Facts only; the stock
#              mapping files take the same key.  (`note` is an internal remark, never shown.)
#   data_set_note_counts: a further sentence with {not_joined} and {total} filled from this build's
#              cross-reference join report (items/<source>_xref_join.tsv); left out when there is none

ncbigene:
  replaces: [ncbi-gene]
  data_source_name: NCBI
  data_source_url: https://rdfportal.org/dataset/ncbigene
  data_set_title: NCBI Gene (RDF Portal)
  citation_note: "No citation recorded: the NCBI Gene FTP README states none, and NCBI Gene's help book (www.ncbi.nlm.nih.gov/books/NBK3841, /gene/about) answers the sandbox with a reCAPTCHA page (read 2026-11-20, twice), so its own citation request could not be read."
  data_set_licence: "https://www.ncbi.nlm.nih.gov/home/about/policies/"
  licence: "No restrictions by NCBI (NCBI data-use policy; no licence named)"
  licence_status: verified
  licence_url: "https://www.ncbi.nlm.nih.gov/home/about/policies/"
  licence_checked: "2026-11-18"
  licence_quote: "NCBI itself places no restrictions on the use or distribution of the data contained therein."
  licence_conditions:
    - "No licence is named and NCBI asks for no attribution for the data. The policy (Molecular Data Usage) adds: \"some submitters of the original data (or the country of origin of such data) may claim patent, copyright, or other intellectual property rights in all or a portion of the data\"; NCBI \"cannot provide comment or unrestricted permission concerning the use, copying, or distribution of the information contained in the molecular databases\"."
    - "For NCBI's own web pages (public domain): \"it is requested that in any subsequent use of this work, NLM be given appropriate acknowledgment\". Giving that acknowledgement is cheap and the notice files do it."
    - "The server notice (https://ftp.ncbi.nlm.nih.gov/README.ftp) agrees: \"ALL DATA HERE IS PUBLIC, NON-SENSITIVE, UNRESTRICTED SCIENTIFIC DATA SHARING AMONG SCIENTIFIC COMMUNITIES.\""
  redistributable: true
  redistributable_reason: "NCBI places no restrictions on use or distribution of its molecular data; third-party claims on single records are the submitters' (NCBI cannot grant them)."
  rdfportal_licence: "https://www.ncbi.nlm.nih.gov/home/about/policies/"
  rdfportal_licence_url: "https://rdfportal.org/dataset/ncbigene/"
  rdfportal_licence_note: "RDF Portal's page gives a URL (NCBI's policies page, read 2026-11-18: see licence_quote), not a licence name."
  consts: {Organism.taxonId: "9606"}
  gene_scope_field: primaryIdentifier
  # STATUS.md D14: 255 Ensembl gene ids in NCBI's own cross-reference data are each shared by
  # two or more distinct NCBI Entrez records (overlapping-transcript/antisense annotations, e.g.
  # ENSG00000248767 <- both FOXL3-OT1 and FOXL3) - real upstream ambiguity, not an rdfc2im bug,
  # but it makes Gene.secondaryIdentifier non-unique, which key_secondaryidentifier_org assumes.
  #
  # Gene.symbol (rdfs:label, NCBI's own Symbol column) is unique among the panel genes but not in
  # the whole genome: in the full human set (--gene-identifiers all) ten tRNA symbols are each
  # shared by 2 to 17 Entrez records (TRNAG-GCC, TRNAD-GUC, ...; NCBI gene_info 18 Nov 2026), and
  # InterMine keys Gene on (symbol, organism) too, so they would merge.  NcbiGeneConverter sets a
  # symbol only when it is the nomenclature symbol or unique in the taxon (isUniqueSymbol): the
  # same rule here, the symbol is dropped from every holder of a shared one (they keep their
  # Entrez id and synonyms).
  key_ambiguity:
    Gene:
      - {field: secondaryIdentifier, prefer_field: typeOfGene, prefer_value: protein-coding}
      - {field: symbol}
  # An unscoped fetch (--gene-identifiers all) keeps the gene types the stock loader keeps:
  # NcbiGeneInfoParser.TYPES_TO_IGNORE drops other, biological-region and unknown (130,304 of the
  # 194,018 human records in RDF Portal's graph).  scope.apply_full_scope_filter.
  full_scope_filter:
    Gene.typeOfGene: [protein-coding, ncRNA, pseudo, snoRNA, rRNA, tRNA, snRNA, scRNA]
  # Its genes all carry their Entrez id: merge on that alone, never on a symbol or an Ensembl id,
  # which can name another Entrez gene in another source (project.source_keys) [im-9n4.40].
  own_keys: {Gene: [primaryIdentifier]}
  scope: good
hgnc:
  replaces: [hgnc]
  data_source_name: HGNC
  data_source_url: https://rdfportal.org/dataset/hgnc
  data_set_title: HGNC identifiers (RDF Portal)
  citation_pmid: "41287213"
  citation_evidence: "https://www.genenames.org/help/faq/ (read 2026-11-20): \"How should I cite HGNC nomenclature resources? Authors are requested to cite: Seal RL ... Genenames.org: the HGNC and PGNC resources in 2026. Nucleic Acids Res. PMID: 41287213\". https://www.genenames.org/about/ also asks for the committee's name and the URL, or RRID:SCR_002827."
  data_set_licence: "https://creativecommons.org/publicdomain/zero/1.0/"
  licence: "CC0-1.0"
  licence_status: verified
  licence_url: "https://www.genenames.org/about/license/"
  licence_checked: "2026-11-18"
  licence_quote: "all data is released under the Creative Commons Public Domain (CC0) License. This means that any form of reuse of the content is permitted."
  licence_conditions:
    - "\"Although stating the source is not mandatory, the HGNC recommends attribution (e.g. in publications, services or products)\". Recommended citation: Seal RL et al., Genenames.org: the HGNC and PGNC resources in 2026, Nucleic Acids Research (Database issue); or by RRID: HGNC (RRID:SCR_002827)."
  redistributable: true
  redistributable_reason: "CC0 allows redistribution without conditions."
  rdfportal_licence: "https://www.genenames.org/about/"
  rdfportal_licence_url: "https://rdfportal.org/dataset/hgnc/"
  rdfportal_licence_note: "RDF Portal's page gives HGNC's about page as the licence; HGNC's licence page (read 2026-11-18) states CC0, the same as the upstream record."
  consts: {Organism.taxonId: "9606"}
  # hgnc's Protein items (see_also uniprot) are an accession and a gene link; outside the panel
  # (--gene-identifiers all) nothing else gives them an organism.  items.organisms_from_genes.
  organism_from_genes: [Protein]
  # As ncbigene: Entrez-keyed genes merge on the Entrez id only (project.source_keys).
  own_keys: {Gene: [primaryIdentifier]}
  # HGNC's own data gives some Ensembl ids to two genes (ENSG00000175658: Entrez 1818 and
  # 101060524); drop it from both, as for ncbigene (STATUS.md D14).  No effect on the panel.
  key_ambiguity:
    Gene: {field: secondaryIdentifier}
  # Where the two RDF snapshots disagree on who owns a symbol or an Ensembl id (5 symbols, 101 ids
  # with every gene loaded; RNR1 is HGNC's 6052 but NCBI's 4549), hgnc yields to ncbigene, which
  # ranks first for both fields.  Needs out/ncbigene/items written first (SOURCES order).
  defer_to:
    ncbigene: {class: Gene, key: primaryIdentifier, fields: [symbol, secondaryIdentifier]}
  gene_scope_field: primaryIdentifier
  scope: good
uniprot:
  # Alongside, not a replacement: stock uniprot loads features, comments, isoforms, components and
  # canonical-protein links that these queries do not.  Both key Protein on primaryAccession.
  replaces: []
  alongside: [uniprot]
  data_source_name: UniProt
  # Fetched via RDF Portal's SIB mirror (out/uniprot/queries/*.sparql's Endpoint: comment says
  # rdfportal.org/sib/sparql), not UniProt's own sparql.uniprot.org - the sparql.uniprot.org
  # names in the queries are FROM-clause named graphs inside that RDF Portal dataset, not the
  # endpoint the requests are actually sent to. Provenance link is RDF Portal's dataset page.
  data_source_url: https://rdfportal.org/dataset/uniprot/
  # Not "Swiss-Prot": these queries do not filter on up:reviewed, so they return TrEMBL too
  # (20,431 reviewed vs 190,278 unreviewed human entries), which matches stock HumanMine - see
  # core:reviewed in knowledge.yaml.  Stock names two datasets, "Swiss-Prot data set" and
  # "TrEMBL data set", by input file; one query cannot, so the title says what it holds.
  data_set_title: UniProtKB, Swiss-Prot and TrEMBL (RDF Portal)
  citation_pmid: "39552041"
  citation_evidence: "As the stock uniprot source: https://rest.uniprot.org/help/publications (read 2026-11-20), \"please consider citing our latest publication\" UniProt: the Universal Protein Knowledgebase in 2025 (DOI 10.1093/nar/gkae1010; PMID by E-utilities esearch on that DOI). RDF Portal asks that a dataset's original provider be cited."
  data_set_licence: "https://creativecommons.org/licenses/by/4.0/"
  licence: "CC-BY-4.0"
  licence_status: verified
  licence_url: "https://ftp.ebi.ac.uk/pub/databases/uniprot/current_release/knowledgebase/complete/README"
  licence_checked: "2026-11-18"
  licence_quote: "We have chosen to apply the Creative Commons Attribution 4.0 International (CC BY 4.0) License (https://creativecommons.org/licenses/by/4.0/) to all copyrightable parts of our databases."
  licence_conditions:
    - "Attribution: credit the UniProt Consortium and say that the data were changed (this build keeps human Swiss-Prot entries, cut to the gene panel)."
    - "The README adds: some data may be covered by patents or other rights, and medical or genetic information is for research, educational and informational purposes only."
  redistributable: true
  redistributable_reason: "CC BY 4.0 allows redistribution with attribution."
  rdfportal_licence: "Creative Commons Attribution 4.0 International (CC BY 4.0) License"
  rdfportal_licence_url: "https://rdfportal.org/dataset/uniprot/"
  rdfportal_licence_note: "Same as upstream."
  consts: {Organism.taxonId: "9606"}
  gene_scope_field: symbol
  # Sequences [im-9n4.32].  rdf-config's model gives a sequence node only rdf:value, core:mass and
  # core:name; the data also states core:md5Checksum (the same md5 stock uniprot stores: P10635
  # c71ffc3c...) and core:fragment ("single" or "multiple", on 376 of the panel's 1,548 canonical
  # sequences; absent on a complete one).  Checked on RDF Portal's SIB mirror, 18 Nov 2026.
  model_additions:
    SimpleSequence:
      - core:md5Checksum?:
          - seq_md5: "a1c452186d610c734d3e3c69a5600db1"
      - core:fragment?:
          - seq_fragment: "single"
  # core:sequence names every isoform of an entry (P26367-1 Simple_Sequence, -2 Modified_Sequence,
  # -3 Unknown_Sequence) and, for 1 panel entry, another entry's canonical sequence (P01308 ->
  # F8WCM5-1, typed Simple_Sequence and External_Sequence).  The entry's own canonical sequence is
  # the Simple_Sequence named isoforms:<its accession>-N; exactly one per panel entry.
  node_constraints:
    SimpleSequence:
      - "?{var} a core:Simple_Sequence ."
      - 'FILTER(STRSTARTS(STR(?{var}), CONCAT(REPLACE(STR(?{root}), "/uniprot/", "/isoforms/"), "-")))'
  # Protein merges on its accession only, never on md5checksum+organism (stock uniprot's key, which
  # the type's keys file carries): a TrEMBL entry with the same sequence as a Swiss-Prot entry is a
  # different protein.  This source writes no Protein.md5checksum either.  Sequence merges on its
  # md5: a canonical Swiss-Prot sequence is the object stock uniprot stored, not a second copy.
  own_keys: {Protein: [primaryAccession], Sequence: [md5checksum]}
  scope: good
go:
  replaces: [go]
  data_source_name: GO
  # GO's own project site, not RDF Portal - confirmed live rdfportal.org has no /dataset/go
  # landing page (its own graph is under /ontology/go, which 404s as a page, unlike the other
  # RDF-Portal-hosted sources here).
  data_source_url: https://geneontology.org/
  data_set_title: GO (RDF Portal)
  citation_pmid: "41413728"
  citation_evidence: "https://geneontology.org/docs/go-citation-policy/ (read 2026-11-20): \"whenever using the GO and/or annotations in a publication, please cite the two papers below (the original paper describing GO, and our most recent update paper)\": the update paper, The Gene Ontology knowledgebase in 2026 (PubMed link 41413728), recorded here; the original is Ashburner et al. 2000 (DOI 10.1038/75556, no PMID printed). RDF Portal (https://rdfportal.org/documents/manual/) asks that a dataset's original provider be cited."
  data_set_licence: "https://creativecommons.org/licenses/by/4.0/"
  licence: "CC-BY-4.0"
  licence_status: verified
  licence_url: "https://geneontology.org/docs/go-citation-policy/"
  licence_checked: "2026-11-18"
  licence_quote: "Gene Ontology Consortium data and data products are licensed under the Creative Commons Attribution 4.0 Unported License."
  licence_conditions:
    - "CC BY 4.0 attribution as the GO page spells it out: identify the creator (Gene Ontology Consortium), give a copyright notice, a notice that refers to the licence and to the disclaimer of warranties, and a link. Its example: \"Gene Ontology data from the 2024-01-17 release ( DOI:10.5281/zenodo.10536401 ) is made available under the terms of the CC BY 4.0 license.\""
    - "\"We ask that when using or citing GO data that the particular release is mentioned\" (date, optionally the Zenodo DOI). In publications cite Ashburner et al., Nat Genet 2000;25:25-9 and The Gene Ontology Consortium, The Gene Ontology knowledgebase in 2026, Nucleic Acids Res 2025 (doi 10.1093/nar/gkaf1292)."
    - "The ontology file go-basic.obo says the same in its header: \"property_value: terms:license http://creativecommons.org/licenses/by/4.0/\" (https://current.geneontology.org/ontology/go-basic.obo)."
  redistributable: true
  redistributable_reason: "CC BY 4.0 allows redistribution with attribution."
  rdfportal_licence_note: "RDF Portal has no data set page for GO (rdfportal.org/dataset/go and /ontology/go answer 404)."
  consts: {Ontology.name: GO}
  scope: good
hpo:
  replaces: [hpo]
  data_source_name: HPO
  data_set_title: Human Phenotype Ontology (RDF Portal)
  citation_pmid: "37953324"
  citation_evidence: "As the stock hpo-annotation source: https://hpo.jax.org/citation (read 2026-11-20), \"Please cite our most recent article if you use the HPO for published work\", The Human Phenotype Ontology in 2024 (PMID 37953324)."
  data_set_licence: "https://hpo.jax.org/license"
  licence: "HPO licence (acknowledge and cite; show file dates or versions; content and relationships not to be altered)"
  licence_status: verified
  licence_url: "https://hpo.jax.org/license"
  licence_checked: "2026-11-18"
  licence_quote: "The HPO vocabularies, annotation files, tools and documentation are freely available."
  licence_conditions:
    - "\"anyone can download the HPO and use the ontologies or other HPO files under three conditions: That the Human Phenotype Ontology Consortium is acknowledged and cited properly. That any HPO Consortium file(s) displayed publicly include the date(s) and/or version number(s) of the relevant HPO file(s). That neither the content of the HPO file(s) nor the logical relationships embedded within the HPO file(s) be altered in any way. (Content additions and modifications have to be suggested using our issue tracker.)\""
    - "\"Users of the HPO should add the following statement to their online presence. This service/product uses the Human Phenotype Ontology (version information). Find out more at http://www.human-phenotype-ontology.org We request that the HPO logo be included as well.\""
    - "The HPO is copyrighted \"to protect the integrity of the vocabularies, which means that changes to the HPO vocabularies need to be done by HPO developers\". A copy that leaves rows out (the gene-panel cut of the annotation files) or re-writes the ontology as tables is not an alteration of any row or relationship, but the licence does not say so: this is a reading, for the project owner to accept or to put to the HPO team."
    - "The page is a JavaScript page; its text was read in a browser (hpo.jax.org/app/license redirects to hpo.jax.org/license)."
    - "hp.obo's header points to https://hpo.jax.org/app/license, which is this page."
  redistributable: true
  redistributable_reason: "Redistribution is allowed under the three conditions. The cached hpo group is the whole ontology re-written as six tables (terms, alternative ids, synonyms, SNOMED CT cross-references, superclasses) with nothing left out or changed, which is a reading of 'not altered' the project owner should accept (or confirm with the HPO team)."
  rdfportal_licence_note: "RDF Portal has no data set page for HPO (rdfportal.org/dataset/hpo answers 404)."
  consts: {Ontology.name: Human Phenotype Ontology}
  scope: good
mp:
  replaces: [mammalian-phenotype-ontology]
  data_source_name: MGI
  data_set_title: Mammalian Phenotype Ontology (RDF Portal)
  consts: {Ontology.name: Mammalian Phenotype Ontology}
  scope: good
uberon:
