  # reverses, which this source never writes.  Pathway merges on identifier (R-HSA-... in both);
  # this source adds descriptions.
  replaces: []
  alongside: [reactome]
  data_source_name: Reactome
  data_source_url: https://rdfportal.org/dataset/reactome
  # The stock reactome source's own data set title, so the Pathway items of both sources join ONE
  # data set (DataSet merges on name).  Under a title of our own ("Reactome pathways (RDF Portal)")
