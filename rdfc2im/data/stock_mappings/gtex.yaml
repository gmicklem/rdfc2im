# GTEx v8: median TPM per gene in 54 tissues (gene median TPM GCT), loaded as RNASeqResult.
# The converter can also read v7 eQTL files (name containing "signif"); none is staged.
source: gtex
loader:
  repository: humanmine-bio-sources
  path: gtex
  classes: [org.intermine.bio.dataconversion.GtexConverter]
  commit: d67fc5d
basis: read from code at humanmine-bio-sources d67fc5d (GtexConverter.java, BioDirectoryConverter.java, BioStoreHook.java)
data_source: GTEx portal                      # GtexConverter.java:43, stored at :60-67
# data_source_url/description: what HumanMine's datasets.xml (humanmine-datasets e7a86ea) gave this DataSource [im-9n4.52] (a url, no description)
data_source_url: "https://www.gtexportal.org/home/"
# the eQTL data set is stored empty: no signif file is staged, so no file of this build feeds it (no version)
data_set_files: {"Single-Tissue cis-eQTL Data": []}
data_sets: [RNA-Seq Data, Single-Tissue cis-eQTL Data]   # GtexConverter.java:38-39, stored at :69-87 (no licence)
home: https://www.gtexportal.org/home/
citation_note: "No citation recorded: the GTEx Portal (gtexportal.org, 'Citing GTEx', read 2026-11-20) asks for a data statement (\"The data used for the analyses described in this manuscript were obtained from: the GTEx Portal on MM/DD/YY and/or dbGaP accession number phs000424.vN.pN\") and an acknowledgement, not a paper."
writes: [RNASeqResult, Gene, Organism, DataSet, DataSource, Ontology, SOTerm]
# Both DataSets are always stored; "Single-Tissue cis-eQTL Data" stays empty, and SNP items are made
# only from a "signif" file (:102-103, :234-247), which is not staged. The DataSource/DataSet names are
# not passed to BioDirectoryConverter (:55), so the store hook adds no data set: RNASeqResult.dataSets
# and Gene.dataSets are set by hand (:209, :212). Ontology and SOTerm (gene) come from the store hook.
files:
  - id: median
    format: tab
    release: [{"from": "url", "pattern": "_(v\\d+)_", "label": "GTEx"}]
    comment: "#"
    skip_lines: 2
    header_line: 3
    record: one row (one gene, with its median TPM in each tissue)
    record_key: null
    unlisted: not loaded
    unlisted_reason: >-
      processExpression reads column 1 and every column from 3 to the end of the row
      (GtexConverter.java:191, :198); all 56 header columns are listed.
    fields:
      - key: "col:1"
        name: Name
        description: versioned Ensembl gene id (e.g. ENSG00000169962.4)
        maps_to: [Gene.primaryIdentifier, RNASeqResult.gene]
        status: loaded
        reason: "resolved through the ID resolver"
        code: GtexConverter.java:191
        note: >-
          The version is cut off at the first dot (:252-253), then the id is resolved through the
          human ID resolver (IdResolverService.getIdResolverByOrganism, taxon 9606, :94, :249-265);
          the row is dropped unless it resolves to exactly one gene, whose resolved id (the NCBI Gene
          id with HumanMine's entrez resolver) becomes Gene.primaryIdentifier (:217-232). Without a
          human resolver the unversioned Ensembl id is used. Gene.organism is taxon 9606; genes are
          stored in close() (:111-119). Line 1 (#1.2) is a comment to the parser; line 2 is skipped
          because no header has been seen yet (:188-190). The header line itself is then also tried as
          a data row with gene id "Name" (:184-195): the resolver drops it, but without a human
          resolver it would make a Gene "Name".
      - key: "col:2"
        name: Description
        description: gene symbol
        maps_to: []
        status: not loaded
        reason: "dropped on purpose"
        code: GtexConverter.java:197-198
        note: "'skip first two columns, name and description'; Gene.symbol is not set by this source."
      # Columns 3-56: one per tissue. Each makes one RNASeqResult for the row's gene: tissue = the
      # header cell (as it is), expressionScore = the cell (only when not empty), expressionType = "TPM",
      # dataSets = RNA-Seq Data (GtexConverter.java:198-213).
      - {key: "col:3", name: "Adipose - Subcutaneous", description: "median TPM in this tissue", maps_to: [RNASeqResult.expressionScore, RNASeqResult.tissue], status: loaded, reason: "", code: "GtexConverter.java:198-213", note: ""}
      - {key: "col:4", name: "Adipose - Visceral (Omentum)", description: "median TPM in this tissue", maps_to: [RNASeqResult.expressionScore, RNASeqResult.tissue], status: loaded, reason: "", code: "GtexConverter.java:198-213", note: ""}
