# InterPro's entry database (interpro.xml): every InterPro entry with its type, names, abstract, member-database
# signatures, parent and child entries and cited papers. InterMine's interpro source loads each entry as a
# ProteinDomain; the matches of proteins (ProteinDomainRegion) come from the protein2ipr source.
source: interpro
loader:
  repository: intermine
  path: bio/sources/interpro
  classes: [org.intermine.bio.dataconversion.InterProConverter]
  commit: b81dbfd8e5
basis: read from the code of the demo's InterMine source (InterProConverter.java), counts from interpro.xml of release 111.0
data_source: InterPro
data_sets: [InterPro data set]
home: https://www.ebi.ac.uk/interpro/
writes: [DataSource, DataSet, ProteinDomain, Publication, CrossReference]
# The converter is built with storeOntology=false (InterProConverter.java:62), so no SO Ontology item. A CrossReference
# also gets its own DataSource, named for the member database (Pfam, PROSITE, ...), from createCrossReference.
files:
  - id: entries
    format: xml
    release: [{"from": "line", "pattern": "<dbinfo version=\"([^\"]+)\" dbname=\"INTERPRO\"", "label": "InterPro"}]
    record: one interpro element = one InterPro entry (a domain, family, repeat, site, ...)
    record_key: interprodb/interpro
    unlisted: not loaded
    unlisted_reason: >-
      the handler reads the entry's id, short_name and type, its name and abstract, the dbkey of every db_xref in
      its publication, member_list, parent_list and child_list, and the ipr_ref of the relations it names
      (InterProConverter.java:108-168); every other element and attribute is ignored.
    fields:
      - key: "interprodb/interpro/@id"
        name: id
        description: InterPro accession (IPR000001)
        maps_to: [ProteinDomain.primaryIdentifier]
        status: loaded
        reason: ""
        code: InterProConverter.java:112, 207-214
        note: "One ProteinDomain per entry, keyed by primaryIdentifier; merges with the stubs protein2ipr makes."
      - key: "interprodb/interpro/@short_name"
        name: short_name
        description: short name of the entry (Kringle)
        maps_to: [ProteinDomain.shortName]
        status: loaded
        reason: ""
        code: InterProConverter.java:114-115
        note: ""
      - key: "interprodb/interpro/@type"
        name: type
        description: kind of entry (Domain, Family, Homologous_superfamily, Repeat, Site, ...)
        maps_to: [ProteinDomain.type]
        status: loaded
        reason: ""
        code: InterProConverter.java:116
        note: ""
      - key: "interprodb/interpro/@protein_count"
        name: protein_count
        description: number of proteins the entry matches in UniProt
        maps_to: []
        status: not loaded
        reason: "not read by the converter"
        code: InterProConverter.java:108-168
        note: ""
      - key: "interprodb/interpro/@is-llm"
        name: is-llm
        description: whether the entry's text was written by a language model
        maps_to: []
        status: not loaded
        reason: "not read by the converter"
        code: InterProConverter.java:108-168
        note: "A flag added to the file in recent releases."
      - key: "interprodb/interpro/@is-llm-reviewed"
        name: is-llm-reviewed
        description: whether a curator reviewed text written by a language model
        maps_to: []
        status: not loaded
        reason: "not read by the converter"
        code: InterProConverter.java:108-168
        note: ""
      - key: "interprodb/interpro/name"
        name: name
        description: full name of the entry
        maps_to: [ProteinDomain.name]
        status: loaded
        reason: ""
        code: InterProConverter.java:125-127, 197-200
        note: ""
      - key: "interprodb/interpro/abstract"
        name: abstract
        description: descriptive text of the entry, with inline markup (p, cite, db_xref, ul, ...)
        maps_to: [ProteinDomain.description]
        status: loaded
        reason: "text only"
        code: InterProConverter.java:128-130, 201-203, 238-265
        note: >-
          All the text inside the abstract element is joined (leading white space of each piece dropped); the
          markup and the citations and cross-references written inside it are not kept. 72,824 of the entries have
          one.
      - key: "interprodb/interpro/member_list/db_xref"
        name: member database signature
        description: a member-database signature in the entry (db, dbkey, name, protein_count)
        maps_to: [CrossReference.identifier, CrossReference.source, CrossReference.subject]
        status: loaded
        reason: "db and dbkey only"
        code: InterProConverter.java:131-143
        note: >-
          One CrossReference of the ProteinDomain per signature: identifier = dbkey (PF00051), source = a DataSource
          named by the db attribute (PROSITE, SMART, ...), except that the file's "PFAM" is written "Pfam", as
          protein2ipr, UniProt and Pfam spell it (InterProConverter.memberDatabaseName; Gos Micklem, 20 Nov 2026:
          "The correct capitalisation is Pfam" [im-9n4.54]). The signature's name and protein_count attributes are
          not read.
      - key: "interprodb/interpro/pub_list/publication/db_xref"
        name: cited publication
        description: PubMed id of a paper cited by the entry (db PUBMED, dbkey 8606774)
        maps_to: [Publication.pubMedId, ProteinDomain.publications]
        status: loaded
        reason: "dbkey only"
        code: InterProConverter.java:119-123, 218-233
        note: >-
          One Publication per distinct dbkey (every db_xref in a publication element is taken to be a PubMed id).
          The paper's title, authors, year, journal and pages in the same element are not read; they come from the
          pubmed sources.
      - key: "interprodb/interpro/pub_list/publication/title"
        name: publication title
        description: title of a cited paper
        maps_to: []
        status: not loaded
        reason: "not read by the converter"
        code: InterProConverter.java:108-168
        note: ""
      - key: "interprodb/interpro/parent_list/rel_ref/@ipr_ref"
        name: parent entry
        description: InterPro accession of a parent entry
        maps_to: [ProteinDomain.parentFeatures]
        status: loaded
        reason: ""
        code: InterProConverter.java:145-164
        note: "The related entry is a ProteinDomain stub keyed by primaryIdentifier."
      - key: "interprodb/interpro/child_list/rel_ref/@ipr_ref"
        name: child entry
        description: InterPro accession of a child entry
        maps_to: [ProteinDomain.childFeatures]
        status: loaded
        reason: ""
        code: InterProConverter.java:145-164
        note: ""
      - key: "interprodb/interpro/contains"
        name: contains
        description: entries this entry contains (an older element, no longer in the file)
        maps_to: [ProteinDomain.contains]
        status: loaded
        reason: "absent from the current file"
        code: InterProConverter.java:145-164
        note: "The handler reads rel_ref elements of found_in and contains; interpro.xml 111.0 has neither."
      - key: "interprodb/interpro/found_in"
        name: found_in
        description: entries this entry is found in (an older element, no longer in the file)
        maps_to: [ProteinDomain.foundIn]
        status: loaded
        reason: "absent from the current file"
        code: InterProConverter.java:145-164
        note: ""
      - key: "interprodb/interpro/class_list/classification"
        name: classification
        description: GO term or other classification of the entry (class_type GO, id GO:0003677)
        maps_to: []
        status: not loaded
        reason: "not read by the converter"
        code: InterProConverter.java:108-168
        note: "InterPro's GO mapping comes from the interpro-go source (interpro2go) instead."
      - key: "interprodb/interpro/external_doc_list/db_xref"
        name: external documentation
        description: links to external documents (Wikipedia, PDB, CATH, ...)
        maps_to: []
        status: not loaded
        reason: "not read by the converter"
        code: InterProConverter.java:108-168
        note: ""
      - key: "interprodb/interpro/structure_db_links/db_xref"
        name: structure links
        description: PDB, CATH, SCOP and similar structures matching the entry
        maps_to: []
        status: not loaded
        reason: "not read by the converter"
        code: InterProConverter.java:108-168
        note: "2,103,226 values in 31,655 entries: the biggest part of the file."
      - key: "interprodb/interpro/key_species/taxon_data"
        name: key species
        description: species with the most proteins matched (name, proteins_count)
        maps_to: []
        status: not loaded
        reason: "not read by the converter"
        code: InterProConverter.java:108-168
        note: ""
      - key: "interprodb/interpro/taxonomy_distribution/taxon_data"
        name: taxonomy distribution
        description: number of matched proteins per major taxon
        maps_to: []
        status: not loaded
        reason: "not read by the converter"
        code: InterProConverter.java:108-168
        note: ""
      - key: "interprodb/release/dbinfo"
        name: release information
        description: version, entry count and date of each member database and of InterPro
        maps_to: []
        status: not loaded
        reason: "not read by the converter"
        code: InterProConverter.java:108-168
        note: "DataSet.version is not set."
      - key: "interprodb/deleted_entries/del_ref/@id"
        name: deleted entry
        description: accession of an entry removed from InterPro
        maps_to: []
        status: not loaded
        reason: "not read by the converter"
        code: InterProConverter.java:108-168
        note: ""
