      - {key: "col:27", name: CANONICAL_PROTEIN, description: "UniProt canonical protein(s)", maps_to: [], status: not loaded, reason: not read, code: "RgdIdentifiersConverter.java:77-82"}
      - {key: "col:28", name: MARKER_RGD_ID, description: "RGD_ID(s) of markers associated with given gene", maps_to: [], status: not loaded, reason: not read, code: "RgdIdentifiersConverter.java:77-82"}
      - {key: "col:29", name: MARKER_SYMBOL, description: "marker symbol", maps_to: [], status: not loaded, reason: not read, code: "RgdIdentifiersConverter.java:77-82"}
      - {key: "col:30", name: OLD_SYMBOL, description: "old symbol alias(es)", maps_to: [], status: not loaded, reason: not read, code: "RgdIdentifiersConverter.java:77-82", note: "No Synonym objects are made."}
      - {key: "col:31", name: OLD_NAME, description: "old name alias(es)", maps_to: [], status: not loaded, reason: not read, code: "RgdIdentifiersConverter.java:77-82"}
      - {key: "col:32", name: QTL_RGD_ID, description: "RGD_ID(s) of QTLs associated with given gene", maps_to: [], status: not loaded, reason: not read, code: "RgdIdentifiersConverter.java:77-82"}
      - {key: "col:33", name: QTL_SYMBOL, description: "QTL symbol", maps_to: [], status: not loaded, reason: not read, code: "RgdIdentifiersConverter.java:77-82"}
      - {key: "col:34", name: NOMENCLATURE_STATUS, description: "nomenclature status", maps_to: [], status: not loaded, reason: not read, code: "RgdIdentifiersConverter.java:77-82"}
      - {key: "col:35", name: SPLICE_RGD_ID, description: "RGD_IDs for gene splices", maps_to: [], status: not loaded, reason: not read, code: "RgdIdentifiersConverter.java:77-82"}
      - {key: "col:36", name: SPLICE_SYMBOL, description: "symbol for gene", maps_to: [], status: not loaded, reason: not read, code: "RgdIdentifiersConverter.java:77-82"}
      - {key: "col:37", name: GENE_TYPE, description: "gene type", maps_to: [], status: not loaded, reason: not read, code: "RgdIdentifiersConverter.java:77-82", note: "Not used as a filter either: every row becomes a Gene."}
      - key: "col:38"
        name: ENSEMBL_ID
        description: Ensembl Gene ID(s), ';'-separated
        maps_to: [CrossReference.identifier, Gene.crossReferences]
        status: loaded
        reason: ""
        code: RgdIdentifiersConverter.java:82, 89-92, 121-127
        note: >-
          Each ';'-separated id becomes a CrossReference of the gene with source DataSource 'Ensembl'.
          The code also has a block meant to set Gene.primaryIdentifier to a unique Ensembl id
          (lines 110-118), but the map it reads (geneEnsemblIds) is never filled, so it does nothing.
      - {key: "col:39", name: (UNUSED), description: "blank", maps_to: [], status: not loaded, reason: not read, code: "RgdIdentifiersConverter.java:77-82"}
      - {key: "col:40", name: CHROMOSOME_Rnor_5.0, description: "chromosome for Rnor_5.0 reference assembly", maps_to: [], status: not loaded, reason: not read, code: "RgdIdentifiersConverter.java:77-82"}
      - {key: "col:41", name: START_POS_Rnor_5.0, description: "start position for Rnor_5.0 reference assembly", maps_to: [], status: not loaded, reason: not read, code: "RgdIdentifiersConverter.java:77-82"}
